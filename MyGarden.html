:root{--bg:#132c27;--panel:#203b32;--line:#46624b;--ink:#f3edcd;--muted:#b5c5a5;--gold:#f5cb73;--green:#a8d780}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px 'Trebuchet MS',sans-serif}button{font:inherit;color:inherit;cursor:pointer;background:#35513b;border:1px solid #607451;border-bottom:3px solid #0f2820;border-radius:6px;padding:10px 13px}button:hover{background:#4a6747}button:disabled{opacity:.4;cursor:not-allowed}button.on{background:var(--gold);color:#303826;border-color:#e6b95e}header{padding:18px 26px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:20px}h1{font:700 25px Georgia;margin:0;letter-spacing:1px}small,.muted{color:var(--muted)}header small{letter-spacing:3px;font-size:10px}#stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#294334;padding:9px 16px;border-radius:6px}.stat b{color:var(--gold)}main{max-width:1500px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px}.world{position:relative;border:2px solid #718367;border-radius:9px;overflow:hidden;background:#9ac9ac}canvas{display:block;width:100%;image-rendering:pixelated;cursor:crosshair}#skybar{display:flex;justify-content:space-between;padding:12px 16px;background:#253f32;color:#e4eccb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.note{padding:12px 16px;border-left:3px solid var(--gold);background:#233d31;line-height:1.5}.panel{border:1px solid var(--line);background:var(--panel);border-radius:9px;overflow:hidden}nav{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}nav button{font-size:12px;border:0;border-radius:0;padding:16px 2px}.content{padding:15px;max-height:620px;overflow:auto}h2{font:22px Georgia;margin:0 0 5px}h3{margin:0;font-size:15px}.card{padding:12px 0;border-bottom:1px solid #425941;display:flex;gap:10px;align-items:center}.card .detail{flex:1}.card p{font-size:12px;color:var(--muted);margin:5 </style><header><div><small>UN RACÓ PER FER CRÉIXER</small><h1>MyGarden</h1></div><div id="stats"></div></header><main><section><div class="world"><div id="skybar"><span id="weather"></span><span id="day"></span></div><canvas id="game" width="800" height="480" aria-label="Hort interactiu. Selecciona una eina i fes clic en una parcel·la."></canvas></div><div class="legend"><span>■ Terra disponible</span><span style="color:#f5cb73">◆ A punt de collir</span><span style="color:#8ecde3">● Regat</span></div><div class="toolbar" id="tools"></div><div id="seedbar"></div><div class="note" id="inspect">Planta raves als bancals buits. Rega'ls i recull la primera collita!</div><div class="bottom"><div class="panel"><h3>El teu camí</h3><div id="journey"></div></div><div class="panel"><h3>Vida a l'hort</h3><p class="muted" id="event" style="font-size:13px;line-height:1.5"></p></div></div></section><aside class="panel"><nav id="tabs"></nav><div class="content" id="content"></div></aside></main><footer><button onclick="help()">Com es juga</button><button onclick="exportSave()">Exporta partida</button><button onclick="document.getElementById('file').click()">Importa partida</button><button id="sound" onclick="sound=!sound;this.textContent=sound?'So: sí':'So: no'">So: no</button><span id="saveStatus">Desament automàtic</span><input id="file" type="file" accept="application/json,.json" hidden></footer><div id="toast" role="status"></div><dialog id="modal"></dialog><script>
'use strict';
const $=id=>document.getElementById(id),C=$('game'),ctx=C.getContext('2d'),KEY='MyGarden-v1';
const crops=[
['Rave',5,13,25,1,'#ed677d','root'],['Pastanaga',14,34,70,2,'#f3a24e','root'],['Enciam',28,65,130,3,'#abd965','leaf'],['Maduixa',50,110,220,4,'#f15a66','berry'],['Tomàquet',95,210,360,5,'#e86045','berry'],['Pèsol',160,350,540,6,'#bdde66','vine'],['Blat de moro',260,570,780,7,'#f4cf61','corn'],['Albergínia',420,930,1080,8,'#b280cf','root'],['Gira-sol',700,1550,1500,9,'#f4c553','flower'],['Carabassa',1100,2450,2100,10,'#eaa14d','pumpkin'],['Síndria',1800,4100,2700,12,'#62a967','pumpkin'],['Raïm',3000,7000,3600,14,'#bca0e6','berry'],['Flor de lluna',5000,12000,4800,16,'#c4e6f2','flower'],['Fruit del drac',8500,21000,6000,18,'#f08cd4','berry'],['Arbre d’or',15000,39000,7800,21,'#ffda6d','tree'],['Lotus estel·lar',28000,78000,10800,24,'#bb9ff5','flower']
].map((a,id)=>({id,name:a[0],cost:a[1],value:a[2],time:a[3],lv:a[4],color:a[5],shape:a[6]}));
const repeatIds=new Set([3,4,5,7,9,10,11,13,14]);
const repeats=c=>repeatIds.has(c.id),fruitValue=c=>c.value/(repeats(c)?10:1);
const money=n=>n.toLocaleString('ca-ES',{minimumFractionDigits:0,maximumFractionDigits:2});
let market=crops.map(()=>0),marketLast=Date.now();
const seedPrice=c=>Math.round(c.cost*(100+market[c.id]))/100;
function tickMarket(now=Date.now()){if(now-marketLast<3000)return;marketLast=now;market=market.map(old=>old<=-10?-9:old>=10?9:old+(Math.random()<.5?-1:1));refreshMarket();}
function refreshMarket(){if(tab!=='shop')return;for(let c of crops){let label=$('price-'+c.id),button=$('buy-'+c.id);if(!label||!button)continue;let d=market[c.id],price=seedPrice(c);label.textContent=`${d>0?'▲ +':d<0?'▼ ':'• '}${d}% · Original: ${money(c.cost)} ◈`;label.style.color=d<0?'#a8d780':d>0?'#f3a894':'#b5c5a5';button.textContent=money(price)+' ◈';button.disabled=level()<c.lv||s.coins<price;}}
const mutations=[{name:'Natural',m:1,color:'#b5c5a5'},{name:'Gegant',m:2,color:'#b9de7c'},{name:'Daurada',m:5,color:'#f8d26b'},{name:'Prismàtica',m:12,color:'#dda4ef'}];
function fresh(){return {v:1,coins:80,xp:0,plots:Array(48).fill(null),size:8,seeds:crops.map((_,i)=>i===0?8:0),bag:[],harvest:0,orders:0,earned:0,up:{water:0,soil:0,luck:0,sprinkler:0},discovered:[],claimed:[],last:Date.now(),active:0,orderSeed:0,quest:null,started:Date.now(),lastGift:0};}
let s=fresh(),storageOK=true;try{let raw=localStorage.getItem(KEY);if(raw){let a=JSON.parse(raw);if(valid(a))s=a;}}catch(e){storageOK=false;}
let tool='plant',selected=0,tab='shop',sound=false,ac,hover=-1,particles=[],lastUI=0,lastSave=0,bonus=null,nextBonus=Date.now()+15000;
const level=()=>Math.min(30,1+Math.floor(Math.sqrt(s.xp/45))),threshold=l=>45*l*l,fmt=n=>Math.floor(n).toLocaleString('ca-ES'),duration=t=>t>=3600?`${Math.floor(t/3600)} h ${Math.floor(t%3600/60)} min`:t>=60?`${Math.floor(t/60)} min ${Math.ceil(t%60)} s`:`${Math.ceil(t)} s`;
function valid(a){return a&&a.v===1&&Number.isFinite(a.coins)&&a.coins>=0&&Number.isFinite(a.xp)&&a.xp>=0&&Number.isFinite(a.last)&&Number.isFinite(a.started)&&Number.isFinite(a.active)&&Number.isInteger(a.size)&&a.size>=8&&a.size<=48&&a.size%8===0&&Array.isArray(a.plots)&&a.plots.length===48&&a.plots.every(p=>p===null||(Number.isInteger(p.id)&&crops[p.id]&&Number.isFinite(p.growth)&&p.growth>=0&&typeof p.water==='boolean'))&&Array.isArray(a.seeds)&&a.seeds.length===16&&a.seeds.every(n=>Number.isInteger(n)&&n>=0)&&Array.isArray(a.bag)&&a.bag.every(b=>crops[b.id]&&mutations[b.m]&&Number.isFinite(b.value)&&b.value>=0)&&a.up&&['water','soil','luck','sprinkler'].every(k=>Number.isInteger(a.up[k])&&a.up[k]>=0&&a.up[k]<=10)&&['harvest','orders','earned','orderSeed','lastGift'].every(k=>Number.isFinite(a[k])&&a[k]>=0)&&['discovered','claimed'].every(k=>Array.isArray(a[k]))&&(a.quest===null||(a.quest&&crops[a.quest.id]&&Number.isInteger(a.quest.n)&&a.quest.n>0&&Number.isFinite(a.quest.reward)&&a.quest.reward>0));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$('saveStatus').textContent='Partida desada · '+new Date().toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'});}catch(e){storageOK=false;$('saveStatus').textContent='No es pot desar aquí: exporta la partida';}}
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.opacity=0,2800);}
function beep(freq=600){if(!sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(.06,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.13);}catch(e){}}
function weather(now=Date.now()){let i=Math.floor((now-s.started)/180000);return [{name:'Sol suau',rain:false},{name:'Pluja de primavera',rain:true},{name:'Brisa de tarda',rain:false},{name:'Pol·len daurat',rain:false}][((i%4)+4)%4];}
function advance(now,offline=false){let dt=Math.max(0,Math.min((now-s.last)/1000,28800));s.last=now;if(!offline)s.active+=Math.min(dt,2);for(let i=0;i<s.size;i++){let p=s.plots[i];if(!p)continue;let speed=(1+s.up.soil*.12)*(p.water?1.35+s.up.water*.12:1);p.growth=Math.min(crops[p.id].time,p.growth+dt*speed);if(!offline&&weather(now).rain)p.water=true;if(s.up.sprinkler&&i<s.up.sprinkler*8)p.water=true;} }
let offlineTime=Math.max(0,Date.now()-s.last);advance(Date.now(),true);
function xp(n){let old=level();s.xp+=n;if(level()>old)toast('Nivell '+level()+'! Descobreix noves llavors a la botiga.');}
function rect(x,y,w,h,color,g=ctx){g.fillStyle=color;g.fillRect(Math.round(x),Math.round(y),w,h);}
function plantArt(g,c,x,y,stage=1,variant=0,t=0,established=false){let r=(a,b,w,h,col)=>rect(x+a,y+b,w,h,col,g);let col=variant===2?'#f8d36a':variant===3?['#df97ef','#8be2db','#f8cf7e'][Math.floor(t/250)%3]:c.color;if(established&&stage<.85){if(c.shape==='tree'){r(-3,-26,6,27,'#8b6947');r(-16,-40,31,21,'#557e4c');r(-11,-46,22,8,'#6e9e51');}else{r(-2,-23,4,24,'#537d45');r(-13,-21,26,15,'#5b954e');r(-8,-27,17,8,'#79b35d');r(-17,-8,12,5,'#80b860');}if(stage>.45){r(-8,-16,3,3,'#f5df9b');r(7,-23,3,3,'#f5df9b');}return;}if(stage<.2){r(-2,-3,4,3,'#e7bf7b');return;}r(-1,-13,3,14,'#46764b');r(-7,-10,6,4,'#80b860');r(2,-15,7,4,'#aad076');if(stage<.55)return;let size=stage<.85?.75:1;g.save();g.translate(x,y);g.scale(size,size);x=0;y=0;
if(c.shape==='tree'){r(-3,-26,6,27,'#8b6947');r(-16,-40,31,21,'#557e4c');r(-11,-46,22,8,'#6e9e51');for(let k=0;k<4;k++)r(-12+k*7,-35+(k%2)*9,6,6,col);}
else if(c.shape==='flower'){r(-1,-27,3,16,'#5f9652');for(let k=0;k<8;k++){let a=k*Math.PI/4;r(Math.round(Math.cos(a)*9)-3,-30+Math.round(Math.sin(a)*9),7,7,col);}r(-4,-30,9,9,'#866442');r(-1,-28,4,4,'#f9df82');}
else if(c.shape==='corn'){r(-5,-28,10,24,col);r(-8,-14,4,15,'#73a65a');r(5,-20,4,21,'#8eb45c');for(let a=0;a<3;a++)r(-3,-24+a*6,6,2,'#cc9f40');}
else if(c.shape==='pumpkin'||c.shape==='leaf'){r(-14,-14,28,13,col);r(-10,-19,20,20,col);r(-3,-23,5,5,'#728c43');r(-6,-16,3,15,c.shape==='leaf'?'#71a65d':'#b97c3e');r(5,-15,3,14,c.shape==='leaf'?'#d7eaa0':'#f3bf71');}
else if(c.shape==='vine'){r(-1,-30,2,29,'#b5a279');for(let k=0;k<3;k++){r(-7,-12-k*7,7,5,col);r(3,-16-k*6,5,5,col);}}
else if(c.shape==='root'){r(-6,-9,13,11,col);r(-3,2,6,4,col);r(-1,6,2,2,col);r(-6,-16,5,7,'#8cb95b');r(2,-18,4,9,'#bad270');r(-4,-7,4,3,'#ffffff66');}
else{r(-10,-22,19,20,'#5b954e');for(let k=0;k<4;k++){r(-11+k%2*14,-19+Math.floor(k/2)*12,9,9,col);r(-9+k%2*14,-18+Math.floor(k/2)*12,3,2,'#ffffff88');}}
g.restore();}
const icons=crops.map(c=>{let el=document.createElement('canvas');el.width=48;el.height=52;plantArt(el.getContext('2d'),c,24,43);return el.toDataURL();});
function plotPos(i){return {x:160+(i%8)*60,y:122+Math.floor(i/8)*49};}
function draw(now){ctx.imageSmoothingEnabled=false;rect(0,0,800,480,'#86ae69');for(let i=0;i<210;i++){let x=(i*137+13)%800,y=(i*97+31)%480;rect(x,y,3,2,i%3?'#7ba460':'#abc57b');}rect(130,90,518,324,'#d0bd85');rect(139,99,500,303,'#a99666');rect(136,98,507,6,'#e3d2a1');
// Water, stepping stones, trees and cottage.
rect(18,324,89,115,'#547e71');rect(23,329,80,105,'#72b4ba');for(let i=0;i<6;i++)rect(30+(i%2)*20,344+i*14,42,3,'#a1d5c4');for(let i=0;i<5;i++)rect(350,417+i*13,37,10,'#bfb18c');
for(let i=0;i<12;i++){let x=17+i*70;rect(x,61,6,29,'#96774c');rect(x-5,55,16,7,'#bda069');}rect(0,70,800,6,'#c1a975');rect(0,82,800,4,'#9b835b');
for(let side of [0,1])for(let i=0;i<3;i++){let x=side?733:53,y=116+i*75;rect(x-4,y,9,36,'#826345');rect(x-26,y-27,52,39,'#456d4e');rect(x-19,y-39,39,17,'#568754');rect(x-17,y-32,22,10,'#6c9a5b');}
rect(321,18,120,50,'#e6cf98');rect(313,12,136,14,'#9d6b4c');rect(325,4,110,10,'#b58257');rect(370,36,24,32,'#72583f');rect(336,33,20,18,'#80b4b8');rect(407,33,20,18,'#80b4b8');rect(374,1,10,11,'#698e50');
for(let i=0;i<48;i++){let {x,y}=plotPos(i);if(i>=s.size){rect(x-20,y-11,48,38,'#839763');if(i%8===3){ctx.fillStyle='#d0d8a5';ctx.font='11px monospace';ctx.fillText('AMPLIA',x-6,y+12);}continue;}let p=s.plots[i];rect(x-22,y-13,50,39,'#6c4b38');rect(x-20,y-12,46,34,p?.water?'#654632':'#916443');for(let k=0;k<3;k++)rect(x-17,y-7+k*10,39,2,p?.water?'#563d2d':'#785437');if(p){let c=crops[p.id],progress=p.growth/c.time;plantArt(ctx,c,x+3,y+12,progress,p.m||0,now,!!p.established);if(p.water)rect(x+19,y+18,3,4,'#8ac7dc');if(progress>=1){rect(x-18,y-18,6,6,'#ffe29b');if(Math.floor(now/500)%2)rect(x-16,y-21,2,12,'#fff1c8');}else{rect(x-17,y+21,34,3,'#49382a');rect(x-17,y+21,Math.floor(34*progress),3,'#b5cf7a');}}if(i===hover){ctx.strokeStyle='#fff0b5';ctx.lineWidth=2;ctx.strokeRect(x-23,y-15,51,42);}}
// A little gardener watches over the beds.
let bob=Math.floor(now/550)%2;rect(669,385+bob,14,16,'#5c8390');rect(669,375+bob,14,11,'#e6b580');rect(663,369+bob,26,7,'#edce87');rect(668,362+bob,16,9,'#d7b269');rect(670,401,4,7,'#493f37');rect(679,401,4,7,'#493f37');rect(679,378+bob,2,2,'#344a39');
let night=((Date.now()-s.started)%1200000)/1200000;if(night>.65)rect(0,0,800,480,'rgba(23,35,67,'+Math.sin((night-.65)/.35*Math.PI)*.36+')');if(weather().rain){for(let i=0;i<50;i++)rect((i*37+now/25)%800,(i*71+now/6)%480,1,7,'#d6efdf88');}
if(bonus){let y=bonus.y+Math.sin(now/160)*5;rect(bonus.x-7,y-3,6,9,'#f6d186');rect(bonus.x+3,y-6,7,9,'#f4af97');rect(bonus.x,y,3,9,'#54443c');ctx.fillStyle='#fff1b7';ctx.font='10px monospace';ctx.fillText('+',bonus.x, y-10);}
particles=particles.filter(p=>now-p.t<1100);for(let p of particles){ctx.fillStyle='#fff0af';ctx.font='bold 14px monospace';ctx.fillText(p.text,p.x,p.y-(now-p.t)/35);} }
function burst(i,text){let p=plotPos(i);particles.push({...p,text,t:performance.now()});}
function action(i){if(i<0||i>=48)return;if(i>=s.size){toast('Amplia l’hort a la pestanya Millores.');return;}let p=s.plots[i];if(tool==='plant'){if(p){toast('Aquest bancal ja està ocupat.');return;}if(!s.seeds[selected]){toast('Compra més llavors a la botiga.');return;}s.seeds[selected]--;s.plots[i]={id:selected,growth:0,water:s.up.sprinkler*8>i,m:0};beep(410);}
if(tool==='water'){if(!p)return;if(p.water){toast('Ja està regat fins a la collita.');return;}p.water=true;burst(i,'Aigua!');beep(700);}
if(tool==='harvest'){if(!p)return;let c=crops[p.id];if(p.growth<c.time){toast(c.name+': falten '+duration((c.time-p.growth)/((1+s.up.soil*.12)*(p.water?1.35+s.up.water*.12:1))));return;}let r=Math.random(),luck=s.up.luck*.007+(weather().name==='Pol·len daurat'?.02:0);let m=r<.004+luck/4?3:r<.03+luck?2:r<.15+luck?1:0;let weight=+(0.8+Math.random()*.65).toFixed(2);let value=Math.round(fruitValue(c)*mutations[m].m*weight);s.bag.push({id:p.id,m,weight,value});s.harvest++;if(!s.discovered.includes(p.id+':'+m))s.discovered.push(p.id+':'+m);xp(9+c.lv*3);if(repeats(c)){p.growth=0;p.established=true;p.water=s.up.sprinkler*8>i;p.m=0;}else s.plots[i]=null;burst(i,mutations[m].name+'!');beep(m?1000:800);}
if(tool==='shovel'){if(!p){toast('Aquest bancal ja és buit.');return;}s.plots[i]=null;burst(i,'Bancal lliure');beep(220);toast('Planta retirada. Ja pots plantar-hi una altra llavor.');}if(tool==='inspect'){inspect(i);return;}save();render();}
function inspect(i){let p=s.plots[i];if(i>=s.size){$('inspect').textContent='Terreny per ampliar · Aconsegueix més bancals a Millores.';return;}if(!p){$('inspect').textContent='Bancal '+(i+1)+' · Terra preparada. Selecciona una llavor i l’eina Plantar.';return;}let c=crops[p.id],speed=(1+s.up.soil*.12)*(p.water?1.35+s.up.water*.12:1);$('inspect').textContent=c.name+(repeats(c)?' · Collita renovable':' · Collita única')+(p.established?' · Produint nous fruits':'')+' · '+Math.floor(p.growth/c.time*100)+'% · '+(p.growth>=c.time?'A punt de collir!':duration((c.time-p.growth)/speed))+' · '+(p.water?'Regat: creix més ràpid.':'Sense regar: pots accelerar-ne el creixement.');}
function pos(e){let r=C.getBoundingClientRect();return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*480/r.height};}function hit(p){for(let i=0;i<48;i++){let a=plotPos(i);if(p.x>=a.x-23&&p.x<=a.x+28&&p.y>=a.y-15&&p.y<=a.y+26)return i;}return -1;}
C.addEventListener('pointermove',e=>{hover=hit(pos(e));if(hover>=0)inspect(hover);});C.addEventListener('pointerleave',()=>hover=-1);C.addEventListener('click',e=>{let p=pos(e);if(bonus&&Math.hypot(p.x-bonus.x,p.y-bonus.y)<29){let reward=Math.max(8,level()*7);s.coins+=reward;xp(4);bonus=null;nextBonus=Date.now()+25000+Math.random()*15000;toast('Papallona visitant: +'+reward+' monedes, +4 XP');save();render();return;}action(hit(p));});
function setTool(t){tool=t;renderTools();if(t==='shovel')$('inspect').textContent='Pala: prem una planta per retirar-la i alliberar el bancal. No es recuperen ni la llavor ni els fruits.';}function renderTools(){$('tools').innerHTML=[['plant','1 · Plantar'],['water','2 · Regar'],['harvest','3 · Collir'],['inspect','4 · Explorar'],['shovel','5 · Pala']].map(([a,b])=>`<button class="${tool===a?'on':''}" onclick="setTool('${a}')">${b}</button>`).join('');$('seedbar').innerHTML=crops.filter(c=>s.seeds[c.id]>0).map(c=>`<button class="${selected===c.id?'on':''}" onclick="selected=${c.id};setTool('plant')"><img src="${icons[c.id]}" alt="">${c.name} ×${s.seeds[c.id]}</button>`).join('')||'<small>No tens llavors. Visita la botiga.</small>';}
document.addEventListener('keydown',e=>{if($('modal').open)return;let a=['plant','water','harvest','inspect','shovel'][Number(e.key)-1];if(a)setTool(a);});
function buy(id){let c=crops[id],price=seedPrice(c);if(level()<c.lv||s.coins<price)return;s.coins=Math.round((s.coins-price)*100)/100;s.seeds[id]++;beep(500);save();render();}
function sell(id=-1){let sold=s.bag.filter(b=>id===-1||b.id===id),total=sold.reduce((n,b)=>n+b.value,0);if(!total)return;s.bag=s.bag.filter(b=>!(id===-1||b.id===id));s.coins+=total;s.earned+=total;toast('Collita venuda: +'+fmt(total)+' monedes');beep(800);save();render();}
const upgrades=[['water','Regadora de coure','Cada nivell afegeix un 12% a la bonificació del reg.',150,5],['soil','Terra viva','Cada nivell: +12% de creixement, també sense connexió.',260,8],['luck','Rusc de les meravelles','Augmenta la probabilitat de mutacions rares.',700,6],['sprinkler','Reg automàtic','Cada nivell rega automàticament 8 bancals.',1200,6]];
function upCost(u){return Math.floor(u[3]*Math.pow(2.3,s.up[u[0]]));}function upgrade(k){let u=upgrades.find(u=>u[0]===k),cost=upCost(u);if(s.up[k]>=u[4]||s.coins<cost)return;s.coins-=cost;s.up[k]++;toast('Millora construïda!');save();render();}
function expand(){let cost=expCost();if(s.size>=48||s.coins<cost)return;s.coins-=cost;s.size+=8;save();render();toast('Una nova filera de 8 bancals!');}function expCost(){return [0,250,1600,7500,28000,90000][s.size/8]||0;}
function ensureQuest(){if(s.quest){s.quest.reward=Math.round(fruitValue(crops[s.quest.id])*s.quest.n*1.75);return;}let pool=crops.filter(c=>c.lv<=level());let id=pool[(s.orderSeed*7+Math.floor(level()/2))%pool.length].id,n=3+s.orderSeed%5;s.quest={id,n,reward:Math.round(fruitValue(crops[id])*n*1.75)};}
function deliver(){ensureQuest();let q=s.quest,arr=s.bag.filter(b=>b.id===q.id).sort((a,b)=>a.value-b.value);if(arr.length<q.n)return;let chosen=new Set(arr.slice(0,q.n));s.bag=s.bag.filter(b=>!chosen.has(b));s.coins+=q.reward;s.earned+=q.reward;s.orders++;xp(90+crops[q.id].lv*24);s.orderSeed++;s.quest=null;toast('Encàrrec lliurat! +'+fmt(q.reward)+' monedes');save();render();}
function skipQuest(){s.orderSeed++;s.quest=null;save();render();}
const achievements=[['primera','Primera collita',()=>s.harvest>=1,50],['vint','Mans a la terra',()=>s.harvest>=25,250],['cent','Hortolà constant',()=>s.harvest>=100,1500],['cinc','De confiança',()=>s.orders>=5,1000],['mil','La parada del mercat',()=>s.earned>=10000,2500],['col','Jardí de colors',()=>s.discovered.length>=20,6000],['hores','Dues hores a l’hort',()=>s.active>=7200,10000],['gran','La gran finca',()=>s.size===48,15000],['mestre','Mestre de l’hort',()=>level()>=24,30000]];
function claim(id){let a=achievements.find(a=>a[0]===id);if(!a||!a[2]()||s.claimed.includes(id))return;s.claimed.push(id);s.coins+=a[3];toast('Fita completada! +'+fmt(a[3]));save();render();}
function gift(){if(Date.now()-s.lastGift<300000)return;s.lastGift=Date.now();s.seeds[0]+=3;toast('El veïnat et regala 3 llavors de rave.');save();render();}
function changeTab(t){tab=t;renderPanel();}
function renderPanel(){$('tabs').innerHTML=[['shop','Llavors'],['bag','Collita'],['up','Millores'],['quests','Quadern']].map(([a,b])=>`<button class="${tab===a?'on':''}" onclick="changeTab('${a}')">${b}</button>`).join('');let out='';if(tab==='shop'){out='<h2>La llavoreria</h2><small>Mercat viu: canvis de ±1% cada 3 s, entre −10% i +10% del preu original.</small>';out+=crops.map(c=>`<div class="card"><img class="icon" src="${icons[c.id]}" alt=""><div class="detail"><h3>${c.name}</h3><p>${duration(c.time)} · valor base ${money(fruitValue(c))}<br>${repeats(c)?'Mata o arbre: torna a donar fruits · valor ÷10':'Collita única: cal tornar a plantar'}<br>${level()<c.lv?'Es desbloqueja al nivell '+c.lv:'Tens '+s.seeds[c.id]+' llavors'}<br><span id="price-${c.id}"></span></p></div><button id="buy-${c.id}" onclick="buy(${c.id})" ${level()<c.lv||s.coins<seedPrice(c)?'disabled':''}>${money(seedPrice(c))} ◈</button></div>`).join('');out+=`<div class="card"><div class="detail"><h3>Regal del veïnat</h3><p>3 raves gratuïts cada 5 minuts. Sempre pots tornar a començar!</p></div><button onclick="gift()" ${Date.now()-s.lastGift<300000?'disabled':''}>Recull</button></div>`;}
if(tab==='bag'){let total=s.bag.reduce((a,b)=>a+b.value,0);out=`<h2>La teva collita</h2><p class="muted">${s.bag.length} fruits · ${fmt(total)} monedes</p><button onclick="sell()" ${!total?'disabled':''}>Ven-ho tot · ${fmt(total)} ◈</button><p class="muted" style="font-size:12px">Reserva fruits per als encàrrecs del quadern.</p>`;out+=crops.filter(c=>s.bag.some(b=>b.id===c.id)).map(c=>{let bag=s.bag.filter(b=>b.id===c.id);return `<div class="card"><img class="icon" src="${icons[c.id]}" alt=""><div class="detail"><h3>${c.name} ×${bag.length}</h3><p>${mutations.map((m,i)=>{let n=bag.filter(b=>b.m===i).length;return n?m.name+' ×'+n:'';}).filter(Boolean).join(' · ')}</p></div><button onclick="sell(${c.id})">Ven<br>${fmt(bag.reduce((a,b)=>a+b.value,0))} ◈</button></div>`;}).join('');if(!s.bag.length)out+='<p class="muted">Les collites apareixeran aquí. Selecciona Collir i prem un cultiu madur.</p>';}
if(tab==='up'){out=`<h2>Un hort més gran</h2><small>Inverteix en el futur de la finca.</small><div class="card"><div class="detail"><h3>Amplia els bancals</h3><p>${s.size}/48 parcel·les · +8 per ampliació</p></div><button onclick="expand()" ${s.size>=48||s.coins<expCost()?'disabled':''}>${s.size>=48?'Complet':fmt(expCost())+' ◈'}</button></div>`;out+=upgrades.map(u=>`<div class="card"><div class="detail"><h3>${u[1]} · ${s.up[u[0]]}/${u[4]}</h3><p>${u[2]}</p></div><button onclick="upgrade('${u[0]}')" ${s.up[u[0]]>=u[4]||s.coins<upCost(u)?'disabled':''}>${s.up[u[0]]>=u[4]?'Màxim':fmt(upCost(u))+' ◈'}</button></div>`).join('');}
if(tab==='quests'){ensureQuest();let q=s.quest,c=crops[q.id],n=s.bag.filter(b=>b.id===q.id).length;out=`<h2>El quadern de l’hort</h2><div class="card"><img class="icon" src="${icons[c.id]}" alt=""><div class="detail"><h3>Encàrrec #${s.orders+1}</h3><p>El mercat demana ${q.n} × ${c.name}<br>Tens ${n}/${q.n} · Premi: ${fmt(q.reward)} ◈<br>+${90+c.lv*24} XP · Es lliuren primer els menys valuosos.</p><button onclick="deliver()" ${n<q.n?'disabled':''}>Lliura</button> <button onclick="skipQuest()">Un altre</button></div></div><h3 style="margin-top:15px">Fites</h3>`;out+=achievements.map(a=>`<div class="card"><div class="detail"><h3>${a[1]}</h3><p>Premi: ${fmt(a[3])} monedes</p></div><button onclick="claim('${a[0]}')" ${!a[2]()||s.claimed.includes(a[0])?'disabled':''}>${s.claimed.includes(a[0])?'Fet':a[2]()?'Recull':'Pendent'}</button></div>`).join('');out+=`<h3 style="margin-top:18px">Herbari · ${s.discovered.length}/64</h3><p class="muted" style="font-size:12px">Cada cultiu té 4 variants. Natural ×1, gegant ×2, daurada ×5 i prismàtica ×12.</p>`;out+=crops.map(c=>`<div class="card"><img class="icon" src="${icons[c.id]}" alt=""><div class="detail"><h3>${c.name}</h3><p>${mutations.map((m,i)=>`<span style="color:${s.discovered.includes(c.id+':'+i)?m.color:'#63745c'}">${s.discovered.includes(c.id+':'+i)?'◆':'◇'} ${m.name}</span>`).join(' · ')}</p></div></div>`).join('');}
$('content').innerHTML=out;refreshMarket();}
function render(){$('stats').innerHTML=`<div class="stat">◈ <b>${money(s.coins)}</b></div><div class="stat">Nivell <b>${level()}</b></div><div class="stat">Collites <b>${fmt(s.harvest)}</b></div>`;let l=level(),base=45*(l-1)**2,next=threshold(l);$('journey').innerHTML=`<p class="muted" style="font-size:12px">${l<30?`${fmt(s.xp-base)} / ${fmt(next-base)} XP per al nivell ${l+1}`:'Nivell màxim · continua descobrint mutacions!'}</p><div class="progress"><i style="width:${l===30?100:(s.xp-base)/(next-base)*100}%"></i></div><small>${crops.find(c=>c.lv>l)?'Proper cultiu: '+crops.find(c=>c.lv>l).name+' · nivell '+crops.find(c=>c.lv>l).lv:'Tots els cultius desbloquejats'}</small>`;renderTools();renderPanel();}
function ambient(){let w=weather();$('weather').textContent=(w.rain?'☂ ':'☀ ')+w.name;$('day').textContent='Dia '+(1+Math.floor((Date.now()-s.started)/1200000))+' · '+(((Date.now()-s.started)%1200000)/1200000>.65?'Vespre':'Dia')+' · 20 min / dia';$('event').textContent=w.rain?'La pluja rega els cultius mentre jugues. Els bancals regats creixen més ràpid fins a la collita.':w.name==='Pol·len daurat'?'El pol·len daurat augmenta les possibilitats de mutació en collir. És un bon moment per recollir fruits!':'Clica les papallones per guanyar monedes i experiència. El temps canvia cada 3 minuts. Les plantes no es moren.';}
function help(){$('modal').innerHTML=`<h2>Benvingut a l’Hort de Llum</h2><p>Comença amb <b>8 bancals, 8 llavors de rave i 80 monedes</b>. Fes créixer un petit hort fins a convertir-lo en una finca de 48 bancals.</p><p><b>1.</b> Tria una llavor i prem un bancal per plantar.<br><b>2.</b> Selecciona Regar i prem els cultius.<br><b>3.</b> Quan aparegui una espurna, selecciona Collir.<br><b>4.</b> Ven la collita o lliura encàrrecs al Quadern.</p><p>Tecles <b>1–5</b> per canviar d’eina. Al mòbil, toca els botons i els bancals. Clica les papallones per obtenir recompenses.</p><p><b>Mercat viu:</b> cada llavor canvia de preu cada 3 segons. Cada canvi és de +1% o −1% del preu original, amb un límit total de −10% a +10%. Es mostra el percentatge exacte.</p><p><b>Fruits renovables:</b> maduixeres, tomaqueres, pèsols, alberginieres, carabasseres, síndries, raïm, fruit del drac i arbre d’or es queden plantats en collir. Cada nova collita segueix el mateix temps de creixement i el seu valor base és 10 vegades menor que abans. Torna a regar després de collir, o instal·la reg automàtic. La pala (5) retira una planta sense recuperar-ne la llavor.</p><p>Els primers raves triguen 25 segons; els cultius avançats, fins a 3 hores abans de millores. Hi ha <b>30 nivells, 16 cultius, 64 descobriments i encàrrecs infinits</b>. La progressió està pensada per a diverses hores, segons el teu ritme.</p><p>Els cultius creixen fins a <b>8 hores mentre ets fora</b>. No es panseixen. Es desa al navegador; exporta la partida per conservar-ne una còpia o canviar de dispositiu.</p><button onclick="$('modal').close()">Som-hi, a plantar!</button>`;$('modal').showModal();}
function exportSave(){advance(Date.now());save();let blob=new Blob([JSON.stringify(s)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Hort_de_Llum_partida.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();let a=JSON.parse(await f.text());if(!valid(a))throw Error();if(!confirm('Vols substituir la partida actual per aquesta còpia?'))return;s=a;advance(Date.now(),true);save();render();toast('Partida importada!');}catch(err){toast('Aquest fitxer no és una partida vàlida.');}e.target.value='';});
function loop(now){tickMarket();advance(Date.now());if(Date.now()>nextBonus&&!bonus)bonus={x:70+Math.random()*650,y:420+Math.random()*30,until:Date.now()+22000};if(bonus&&Date.now()>bonus.until){bonus=null;nextBonus=Date.now()+12000;}draw(now);if(now-lastUI>1000){ambient();if(hover>=0)inspect(hover);lastUI=now;}if(now-lastSave>10000){save();lastSave=now;}requestAnimationFrame(loop);}
window.addEventListener('pagehide',()=>{advance(Date.now());save();});document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{advance(Date.now(),true);render();}});render();ambient();requestAnimationFrame(loop);if(offlineTime>60000)toast('Benvingut! Els teus cultius han continuat creixent.');if(s.harvest===0&&!s.plots.some(Boolean))help();
</script></html>
