<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Road</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }

  body {
    background-color: #0d0e12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 100vh;
    max-height: 800px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
    background: #1e232a;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Indicadors de control superior */
  #ui {
    position: absolute;
    top: 18px;
    left: 18px;
    right: 18px;
    display: flex;
    justify-content: flex-start;
    gap: 10px;
    z-index: 10;
    pointer-events: none;
    flex-wrap: wrap;
  }

  .badge {
    background: rgba(18, 20, 26, 0.9);
    color: #ffffff;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(8px);
  }

  .badge-icon {
    font-style: normal;
  }

  #game-over {
    position: absolute;
    inset: 0;
    background: rgba(10, 12, 16, 0.92);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    z-index: 20;
    backdrop-filter: blur(8px);
    opacity: 1;
    transition: opacity 0.3s ease;
  }

  #game-over.hidden {
    display: none;
    opacity: 0;
    pointer-events: none;
  }

  #game-over h1 {
    font-size: 38px;
    font-weight: 800;
    color: #ff4757;
    margin-bottom: 12px;
    text-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
  }

  #game-over p {
    font-size: 20px;
    margin-bottom: 28px;
    color: #e1e2e6;
  }

  #game-over button {
    padding: 14px 36px;
    font-size: 17px;
    font-weight: 700;
    color: #0f172a;
    background: #00d2ff;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
    transition: all 0.2s ease;
  }

  #game-over button:hover {
    transform: translateY(-2px) scale(1.05);
    background: #38ef7d;
    box-shadow: 0 0 25px rgba(56, 239, 125, 0.5);
  }

  /* Instruccions tàctils / Controls */
  #controls-hint {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255, 255, 255, 0.5);
    font-size: 12px;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <!-- Marcador de puntuació i velocitat -->
  <div id="ui">
    <div class="badge"><span class="badge-icon">❖</span> Punts: <span id="score">0</span></div>
    <div class="badge"><span class="badge-icon">⚡</span> Velocitat: <span id="speed">1.0x</span></div>
    <div class="badge"><span class="badge-icon">🏆</span> Rècord: <span id="record">0</span></div>
  </div>

  <!-- Pantalla de Fi de partida -->
  <div id="game-over" class="hidden">
    <h1>Fi de la partida!</h1>
    <p>Puntuació: <span id="final-score">0</span></p>
    <button onclick="restartGame()">Tornar a jugar</button>
  </div>

  <!-- Pista visual de controls -->
  <div id="controls-hint">Fletxes / A-D / Toca esquerra o dreta per canviar de carril</div>

  <canvas id="gameCanvas" width="600" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const recordEl = document.getElementById('record');
const gameOverEl = document.getElementById('game-over');
const finalScoreEl = document.getElementById('final-score');

// Carregar récord guardat
let record = parseInt(localStorage.getItem('carGame_record_v2') || '0', 10);
recordEl.textContent = record;

// Paràmetres principals del joc
let gameRunning = true;
let score = 0;
let baseSpeed = 7;
let speedMultiplier = 1.0;
let currentSpeed = baseSpeed;
let roadOffset = 0;

// Geometria de la carretera (3 Carrils)
const roadX = 120;
const roadWidth = 360;
const numLanes = 3;
const laneWidth = roadWidth / numLanes; // 120px per carril

// Funció per calcular la posició X exacta segons el carril (0, 1, 2)
function getLaneX(laneIndex, itemWidth) {
  return roadX + (laneIndex * laneWidth) + (laneWidth - itemWidth) / 2;
}

let currentLane = 1; // 0 = Esquerra, 1 = Centre, 2 = Dreta

const player = {
  width: 48,
  height: 84,
  x: getLaneX(1, 48), // Comença al carril del centre
  targetX: getLaneX(1, 48),
  y: 450, // POSICIÓ UBICADA MÉS AMUNT A LA PANTALLA (Y = 450)
  color: '#00d2ff'
};

// Enemics i pluja
let enemies = [];
let enemyTimer = 0;

const rain = Array.from({ length: 60 }, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  length: 14 + Math.random() * 12,
  speed: 16 + Math.random() * 8
}));

function moveLeft() {
  if (currentLane > 0) {
    currentLane--;
    player.targetX = getLaneX(currentLane, player.width);
  }
}

function moveRight() {
  if (currentLane < 2) {
    currentLane++;
    player.targetX = getLaneX(currentLane, player.width);
  }
}

// Controls de teclat (canvi estricte de carril amb un toc)
window.addEventListener('keydown', (e) => {
  if (!gameRunning) return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    moveLeft();
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    moveRight();
  }
});

// Controls tàctils / Click (Meitat esquerra o dreta de la pantalla)
canvas.addEventListener('touchstart', (e) => {
  if (!gameRunning) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const touchX = e.touches[0].clientX - rect.left;
  if (touchX < rect.width / 2) {
    moveLeft();
  } else {
    moveRight();
  }
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  if (clickX < rect.width / 2) {
    moveLeft();
  } else {
    moveRight();
  }
});

function spawnEnemy() {
  // Tria un carril a l'atzar
  const lane = Math.floor(Math.random() * numLanes);
  const enemyWidth = 48;
  const enemyX = getLaneX(lane, enemyWidth);

  // Evita generar dos cotxes en la mateixa posició
  const isOccupied = enemies.some(e => e.y < 120 && Math.abs(e.x - enemyX) < 10);
  if (isOccupied) return;

  const colors = ['#ff4757', '#ffa502', '#2ed573', '#eccc68', '#9b59b6'];
  const color = colors[Math.floor(Math.random() * colors.length)];

  enemies.push({
    x: enemyX,
    y: -100,
    width: enemyWidth,
    height: 84,
    color: color,
    lane: lane
  });
}

function drawEnvironment() {
  // Fons de gespa amb franges alternades
  const stripeHeight = 40;
  for (let y = 0; y < canvas.height; y += stripeHeight) {
    const isDark = (Math.floor((y - roadOffset) / stripeHeight) % 2 === 0);
    ctx.fillStyle = isDark ? '#3b7d48' : '#438a50';
    ctx.fillRect(0, y, canvas.width, stripeHeight + 1);
  }

  // Carretera d'asfalt fosc
  ctx.fillStyle = '#2c3038';
  ctx.fillRect(roadX, 0, roadWidth, canvas.height);

  // Pianos verticals (Vermell i Blanc) als vorals
  const curbWidth = 14;
  const curbStripe = 28;
  for (let y = -curbStripe * 2; y < canvas.height + curbStripe; y += curbStripe) {
    const drawY = y + (roadOffset % curbStripe);
    const isRed = (Math.floor((y - roadOffset) / curbStripe) % 2 === 0);
    ctx.fillStyle = isRed ? '#e74c3c' : '#ffffff';

    // Vora esquerra i dreta
    ctx.fillRect(roadX - curbWidth, drawY, curbWidth, curbStripe);
    ctx.fillRect(roadX + roadWidth, drawY, curbWidth, curbStripe);
  }

  // Línies discontínues que separen els 3 carrils
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 4;
  ctx.setLineDash([36, 24]);
  ctx.lineDashOffset = -roadOffset;

  for (let i = 1; i < numLanes; i++) {
    const x = roadX + i * laneWidth;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawCar(x, y, width, height, color, isPlayer = false) {
  ctx.save();

  // Efecte de resplendor cian exclusiu pel jugador
  if (isPlayer) {
    ctx.shadowColor = '#00d2ff';
    ctx.shadowBlur = 18;
  }

  // Chasis del cotxe
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(x, y, width, height, 10);
  ctx.fill();

  ctx.shadowBlur = 0; // Desactivar resplendor per als detalls interiors

  // Pneumàtics
  ctx.fillStyle = '#141414';
  ctx.fillRect(x - 3, y + 12, 5, 16);
  ctx.fillRect(x + width - 2, y + 12, 5, 16);
  ctx.fillRect(x - 3, y + height - 28, 5, 16);
  ctx.fillRect(x + width - 2, y + height - 28, 5, 16);

  // Parabrisa / Cristalls
  ctx.fillStyle = '#19222d';
  ctx.beginPath();
  ctx.roundRect(x + 5, y + 22, width - 10, 32, 6);
  ctx.fill();

  // Techo
  ctx.fillStyle = color;
  ctx.fillRect(x + 7, y + 36, width - 14, 11);

  // Llums davanteres (groga)
  ctx.fillStyle = '#fffb96';
  ctx.fillRect(x + 5, y + 3, 9, 4);
  ctx.fillRect(x + width - 14, y + 3, 9, 4);

  // Llums posteriors (roig)
  ctx.fillStyle = '#ff3838';
  ctx.fillRect(x + 5, y + height - 7, 9, 4);
  ctx.fillRect(x + width - 14, y + height - 7, 9, 4);

  ctx.restore();
}

function drawRain() {
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  rain.forEach(p => {
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + p.length);
    p.y += p.speed;
    if (p.y > canvas.height) {
      p.y = -p.length;
      p.x = Math.random() * canvas.width;
    }
  });
  ctx.stroke();
}

function checkCollision(rect1, rect2) {
  return !(
    rect1.x + rect1.width - 6 < rect2.x + 6 ||
    rect1.x + 6 > rect2.x + rect2.width - 6 ||
    rect1.y + rect1.height - 6 < rect2.y + 6 ||
    rect1.y + 6 > rect2.y + rect2.height - 6
  );
}

function update() {
  if (!gameRunning) return;

  // Puntuació i augment progressiu de velocitat
  score++;
  speedMultiplier = (1 + score / 500).toFixed(1);
  currentSpeed = baseSpeed * parseFloat(speedMultiplier);

  scoreEl.textContent = score;
  speedEl.textContent = speedMultiplier + 'x';

  // Desplaçament de la carretera
  roadOffset += currentSpeed;

  // Moviment suau i automàtic del jugador cap al carril objectiu (Lerp)
  // Això garanteix que mai es quedi aturat entre dos carrils!
  player.x += (player.targetX - player.x) * 0.28;

  // Generació d'enemics
  enemyTimer++;
  if (enemyTimer > Math.max(22, 75 - Math.floor(score / 35))) {
    spawnEnemy();
    enemyTimer = 0;
  }

  // Actualització dels cotxes enemics
  for (let i = enemies.length - 1; i >= 0; i--) {
    let enemy = enemies[i];
    enemy.y += currentSpeed - 1.5;

    // Comprovar col·lisió
    if (checkCollision(player, enemy)) {
      endGame();
      return;
    }

    // Eliminar enemics quan surten de la pantalla
    if (enemy.y > canvas.height + 120) {
      enemies.splice(i, 1);
    }
  }
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Dibuixar entorn i carretera
  drawEnvironment();

  // 2. Dibuixar cotxes enemics
  enemies.forEach(enemy => {
    drawCar(enemy.x, enemy.y, enemy.width, enemy.height, enemy.color, false);
  });

  // 3. Dibuixar el cotxe del jugador (Més amunt, Y=450, Resplendor cian)
  drawCar(player.x, player.y, player.width, player.height, player.color, true);

  // 4. Capa superior de pluja
  drawRain();
}

function gameLoop() {
  update();
  render();
  if (gameRunning) {
    requestAnimationFrame(gameLoop);
  }
}

function endGame() {
  gameRunning = false;
  if (score > record) {
    record = score;
    localStorage.setItem('carGame_record_v2', record);
    recordEl.textContent = record;
  }
  finalScoreEl.textContent = score;
  gameOverEl.classList.remove('hidden');
}

function restartGame() {
  score = 0;
  speedMultiplier = 1.0;
  currentSpeed = baseSpeed;
  roadOffset = 0;
  enemies = [];
  enemyTimer = 0;
  
  currentLane = 1;
  player.x = getLaneX(1, player.width);
  player.targetX = getLaneX(1, player.width);
  
  gameRunning = true;
  gameOverEl.classList.add('hidden');
  gameLoop();
}

// Iniciar el joc
gameLoop();
</script>
</body>
</html>
