<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Neon Runner</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-cyan: #66fcf1;
      --accent-pink: #ff007f;
      --accent-gold: #f39c12;
      --text-color: #c5c6c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-wrapper {
      position: relative;
      width: 800px;
      max-width: 95vw;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border-radius: 10px 10px 0 0;
      border: 1px solid rgba(102, 252, 241, 0.2);
      font-weight: bold;
    }

    .hud-stat {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-stat span {
      color: var(--accent-cyan);
    }

    canvas {
      display: block;
      width: 100%;
      background: #050508;
      border: 1px solid rgba(102, 252, 241, 0.3);
      border-top: none;
      box-shadow: 0 0 20px rgba(102, 252, 241, 0.15);
    }

    .controls-hint {
      text-align: center;
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      z-index: 10;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      color: var(--accent-cyan);
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px var(--accent-cyan);
    }

    p {
      margin-bottom: 20px;
    }

    .btn {
      background: transparent;
      color: var(--accent-cyan);
      border: 2px solid var(--accent-cyan);
      padding: 10px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 5px;
    }

    .btn:hover {
      background: var(--accent-cyan);
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-cyan);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 80%;
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .shop-item {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .shop-item.equipped {
      border-color: var(--accent-cyan);
    }

    .shop-btn {
      padding: 5px 12px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <div class="hud">
    <div class="hud-stat">Puntuació: <span id="score">0</span></div>
    <div class="hud-stat">Rècord: <span id="highScore">0</span></div>
    <div class="hud-stat">Monedes: <span id="coins" style="color: var(--accent-gold);">0</span></div>
  </div>

  <canvas id="gameCanvas" width="800" height="350"></canvas>

  <div id="startMenu" class="overlay">
    <h1 id="menuTitle">QUANTUM RUNNER</h1>
    <p id="menuSubtitle">Prems ESPAI o toca la pantalla per començar</p>
    <div>
      <button class="btn" onclick="startGame()">Jugar</button>
      <button class="btn" onclick="openShop()">Botiga</button>
    </div>
  </div>

  <div id="shopMenu" class="overlay hidden">
    <h1>BOTIGA CIBERNÈTICA</h1>
    <p>Monedes disponibles: <span id="shopCoins" style="color: var(--accent-gold);">0</span></p>

    <div class="shop-grid" id="shopContent">
      <!-- Generat dinàmicament -->
    </div>

    <button class="btn" onclick="closeShop()">Tornar al Joc</button>
  </div>
</div>

<div class="controls-hint">
  Controls: <b>[Espai] / [Fletxa Amunt]</b> = Saltar &nbsp;|&nbsp; <b>[Fletxa Avall]</b> = Acotxar-se
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Elements UI
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const coinsEl = document.getElementById('coins');
  const shopCoinsEl = document.getElementById('shopCoins');
  const startMenu = document.getElementById('startMenu');
  const shopMenu = document.getElementById('shopMenu');
  const menuTitle = document.getElementById('menuTitle');
  const menuSubtitle = document.getElementById('menuSubtitle');
  const shopContent = document.getElementById('shopContent');

  // Estat del joc
  let isRunning = false;
  let score = 0;
  let lastCoinScore = 0; // Per controlar cada 25 punts
  let highScore = parseInt(localStorage.getItem('qr_highscore')) || 0;
  let coins = parseInt(localStorage.getItem('qr_coins')) || 0;
  let frameCount = 0;
  let speed = 6;

  // Carregar Dades Guardades
  let unlockedSkins = JSON.parse(localStorage.getItem('qr_skins')) || ['default'];
  let currentSkin = localStorage.getItem('qr_active_skin') || 'default';
  
  // Clau nova (v2) pels nous power-ups per evitar errors amb els antics
  let activePowerups = JSON.parse(localStorage.getItem('qr_powerups_v2')) || { 
    jumpBoost: false, 
    bigCoins: false, 
    doubleCoins: false 
  };
  
  // Variables dels powerups aplicats DURANT la partida actual
  let sessionPowerups = { jumpBoost: false, bigCoins: false, doubleCoins: false };

  // Definició de Skins amb preus i formes modificades
  const SKINS = {
    default: { name: 'Quadrat Neó', cost: 0, color: '#66fcf1', shape: 'square' },
    triangle: { name: 'Triangle Aeri', cost: 15, color: '#ff007f', shape: 'triangle' },
    orb: { name: 'Orbe de Plasma', cost: 30, color: '#a000ff', shape: 'circle' },
    gold: { name: 'Nucli Daurat', cost: 55, color: '#f39c12', shape: 'diamond' }
  };

  // Definició de Power-Ups nous
  const POWERUPS = {
    jumpBoost: { name: 'Salt +10%', cost: 10, desc: 'Augmenta un 10% l\'alçada' },
    bigCoins: { name: 'Monedes +15%', cost: 30, desc: 'Monedes més grans i fàcils' },
    doubleCoins: { name: 'Monedes x2', cost: 35, desc: 'Duplica tot l\'or de la partida' }
  };

  // Jugador base
  const player = {
    x: 80,
    y: 260,
    width: 35,
    height: 35,
    baseHeight: 35,
    duckHeight: 18,
    vy: 0,
    gravity: 0.7,
    jumpPower: -12, // Base
    isGrounded: false,
    isDucking: false
  };

  // Arrays d'elements
  let obstacles = [];
  let coinItems = [];
  let particles = [];

  // Entrada de teclat i tàctil
  const keys = {};

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
    if (!isRunning && (e.code === 'Space' || e.code === 'ArrowUp')) startGame();
  });

  window.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!isRunning) {
      startGame();
    } else if (player.isGrounded) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
    }
  });

  function updateHUD() {
    scoreEl.innerText = Math.floor(score);
    highScoreEl.innerText = highScore;
    coinsEl.innerText = coins;
    shopCoinsEl.innerText = coins;
  }

  function startGame() {
    startMenu.classList.add('hidden');
    shopMenu.classList.add('hidden');
    
    // Reiniciar variables
    score = 0;
    lastCoinScore = 0;
    speed = 6;
    obstacles = [];
    coinItems = [];
    particles = [];
    player.y = 260;
    player.vy = 0;

    // Aplicar power-ups a la sessió actual
    sessionPowerups = {
      jumpBoost: activePowerups.jumpBoost,
      bigCoins: activePowerups.bigCoins,
      doubleCoins: activePowerups.doubleCoins
    };

    // Aplicar mecànica de salt (+10% power)
    player.jumpPower = sessionPowerups.jumpBoost ? -13.2 : -12;

    // Consumir power-ups (s'han de tornar a comprar per a la següent partida)
    activePowerups.jumpBoost = false;
    activePowerups.bigCoins = false;
    activePowerups.doubleCoins = false;
    saveData();

    isRunning = true;
    requestAnimationFrame(gameLoop);
  }

  function gameOver() {
    isRunning = false;
    if (score > highScore) {
      highScore = Math.floor(score);
      localStorage.setItem('qr_highscore', highScore);
    }
    saveData();
    updateHUD();

    menuTitle.innerText = "GAME OVER";
    menuSubtitle.innerText = `Puntuació aconseguida: ${Math.floor(score)}`;
    startMenu.classList.remove('hidden');
  }

  function saveData() {
    localStorage.setItem('qr_coins', coins);
    localStorage.setItem('qr_skins', JSON.stringify(unlockedSkins));
    localStorage.setItem('qr_active_skin', currentSkin);
    localStorage.setItem('qr_powerups_v2', JSON.stringify(activePowerups));
  }

  // Creació d'obstacles i monedes
  function spawnObstacles() {
    if (frameCount % Math.max(40, Math.floor(100 - speed * 3)) === 0) {
      const type = Math.random() > 0.35 ? 'ground' : 'air';
      if (type === 'ground') {
        obstacles.push({
          x: canvas.width,
          y: 265,
          width: 25 + Math.random() * 15,
          height: 35 + Math.random() * 15,
          type: 'ground'
        });
      } else {
        obstacles.push({
          x: canvas.width,
          y: 200 - Math.random() * 30,
          width: 30,
          height: 25,
          type: 'air'
        });
      }
    }

    if (frameCount % 80 === 0 && Math.random() > 0.3) {
      // Aplicar +15% de tamany si el power-up està actiu (8 -> 9.2)
      let coinRadius = sessionPowerups.bigCoins ? 9.2 : 8; 
      coinItems.push({
        x: canvas.width,
        y: Math.random() > 0.5 ? 260 : 190,
        radius: coinRadius,
        collected: false
      });
    }
  }

  // Crear efecte de partícules
  function createExplosion(x, y, color) {
    for (let i = 0; i < 15; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8,
        radius: Math.random() * 3 + 1,
        color: color,
        alpha: 1
      });
    }
  }

  // Bucle Principal
  function gameLoop() {
    if (!isRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frameCount++;
    score += 0.1;
    speed += 0.001; 

    // Mecànica de 1 moneda per cada 25 punts
    if (Math.floor(score) - lastCoinScore >= 25) {
      lastCoinScore = Math.floor(score);
      // Aplicar multiplicador x2 si toca
      coins += sessionPowerups.doubleCoins ? 2 : 1;
    }

    // --- JUGADOR ---
    if ((keys['Space'] || keys['ArrowUp']) && player.isGrounded) {
      player.vy = player.jumpPower;
      player.isGrounded = false;
    }

    if (keys['ArrowDown'] && player.isGrounded) {
      player.isDucking = true;
      player.height = player.duckHeight;
    } else {
      player.isDucking = false;
      player.height = player.baseHeight;
    }

    player.vy += player.gravity;
    player.y += player.vy;

    const groundLevel = 300 - player.height;
    if (player.y >= groundLevel) {
      player.y = groundLevel;
      player.vy = 0;
      player.isGrounded = true;
    }

    // Dibuixar Línia de Terra
    ctx.strokeStyle = 'rgba(102, 252, 241, 0.4)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 300);
    ctx.lineTo(canvas.width, 300);
    ctx.stroke();

    // Dibuixar Jugador
    const skinData = SKINS[currentSkin];
    ctx.save();
    ctx.fillStyle = skinData.color;
    ctx.shadowColor = skinData.color;
    ctx.shadowBlur = 12;

    if (skinData.shape === 'square') {
      ctx.fillRect(player.x, player.y, player.width, player.height);
    } else if (skinData.shape === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(player.x, player.y + player.height);
      ctx.lineTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.closePath();
      ctx.fill();
    } else if (skinData.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + player.height / 2, player.width / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (skinData.shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(player.x + player.width / 2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height / 2);
      ctx.lineTo(player.x + player.width / 2, player.y + player.height);
      ctx.lineTo(player.x, player.y + player.height / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    // --- OBSTACLES ---
    spawnObstacles();
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= speed;

      // Dibuixar Obstacle
      ctx.save();
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 10;
      if (obs.type === 'ground') {
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
      } else {
        ctx.beginPath();
        ctx.moveTo(obs.x + obs.width / 2, obs.y);
        ctx.lineTo(obs.x + obs.width, obs.y + obs.height / 2);
        ctx.lineTo(obs.x + obs.width / 2, obs.y + obs.height);
        ctx.lineTo(obs.x, obs.y + obs.height / 2);
        ctx.fill();
      }
      ctx.restore();

      // Col·lisió
      if (
        player.x < obs.x + obs.width &&
        player.x + player.width > obs.x &&
        player.y < obs.y + obs.height &&
        player.y + player.height > obs.y
      ) {
        createExplosion(player.x, player.y, skinData.color);
        gameOver();
        return;
      }

      if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    // --- MONEDES ---
    for (let i = coinItems.length - 1; i >= 0; i--) {
      let coin = coinItems[i];
      coin.x -= speed;

      // Dibuixar Moneda
      ctx.save();
      ctx.fillStyle = '#f39c12';
      ctx.shadowColor = '#f39c12';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(coin.x, coin.y, coin.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Recollida (es calcula amb el radi de la moneda per fer-ho més precís)
      let dx = (player.x + player.width / 2) - coin.x;
      let dy = (player.y + player.height / 2) - coin.y;
      if (Math.sqrt(dx * dx + dy * dy) < player.width / 2 + coin.radius) {
        // Multiplicador x2 si està actiu
        coins += sessionPowerups.doubleCoins ? 2 : 1;
        createExplosion(coin.x, coin.y, '#f39c12');
        coinItems.splice(i, 1);
        updateHUD();
        continue;
      }

      if (coin.x < 0) coinItems.splice(i, 1);
    }

    // --- PARTÍCULES ---
    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 0.03;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      if (p.alpha <= 0) particles.splice(i, 1);
    }

    updateHUD();
    requestAnimationFrame(gameLoop);
  }

  // --- GESTIÓ DE LA BOTIGA ---
  function openShop() {
    startMenu.classList.add('hidden');
    shopMenu.classList.remove('hidden');
    renderShop();
  }

  function closeShop() {
    shopMenu.classList.add('hidden');
    startMenu.classList.remove('hidden');
  }

  function renderShop() {
    shopContent.innerHTML = '';

    // Secció Skins
    Object.keys(SKINS).forEach(key => {
      const skin = SKINS[key];
      const isUnlocked = unlockedSkins.includes(key);
      const isEquipped = currentSkin === key;

      const item = document.createElement('div');
      item.className = `shop-item ${isEquipped ? 'equipped' : ''}`;
      
      let buttonHTML = '';
      if (isEquipped) {
        buttonHTML = `<button class="btn shop-btn" disabled>Equipat</button>`;
      } else if (isUnlocked) {
        buttonHTML = `<button class="btn shop-btn" onclick="equipSkin('${key}')">Equipar</button>`;
      } else {
        buttonHTML = `<button class="btn shop-btn" onclick="buySkin('${key}')">Comprar (${skin.cost} M)</button>`;
      }

      item.innerHTML = `
        <strong style="color: ${skin.color}">${skin.name}</strong>
        ${buttonHTML}
      `;
      shopContent.appendChild(item);
    });

    // Secció Power-ups
    Object.keys(POWERUPS).forEach(key => {
      const pw = POWERUPS[key];
      const isActive = activePowerups[key];

      const item = document.createElement('div');
      item.className = 'shop-item';

      let buttonHTML = isActive
        ? `<button class="btn shop-btn" disabled>Actiu pròxima partida</button>`
        : `<button class="btn shop-btn" onclick="buyPowerup('${key}')">Comprar (${pw.cost} M)</button>`;

      item.innerHTML = `
        <strong style="color: var(--accent-cyan)">${pw.name}</strong>
        <span style="font-size:0.75rem; text-align:center;">${pw.desc}</span>
        ${buttonHTML}
      `;
      shopContent.appendChild(item);
    });
  }

  function buySkin(key) {
    const cost = SKINS[key].cost;
    if (coins >= cost) {
      coins -= cost;
      unlockedSkins.push(key);
      currentSkin = key;
      saveData();
      updateHUD();
      renderShop();
    } else {
      alert("No tens suficients monedes!");
    }
  }

  function equipSkin(key) {
    currentSkin = key;
    saveData();
    renderShop();
  }

  function buyPowerup(key) {
    const cost = POWERUPS[key].cost;
    if (coins >= cost) {
      coins -= cost;
      activePowerups[key] = true;
      saveData();
      updateHUD();
      renderShop();
    } else {
      alert("No tens suficients monedes!");
    }
  }

  updateHUD();
</script>
</body>
</html>
