<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quatre en Ratlla - Amb 3 Nivells de Bot</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --board-bg: #2563eb;
            --p1-color: #ef4444; /* Vermell */
            --p2-color: #eab308; /* Groc */
            --empty-color: #ffffff;
            --text-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            color: #0f172a;
        }

        /* Panell de configuració */
        .config-panel {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .opcio {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            font-size: 1em;
            cursor: pointer;
        }

        /* Estat */
        .estat {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            justify-content: center;
        }

        .indicador-torn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Taulell */
        .taulell {
            display: grid;
            grid-template-columns: repeat(7, 55px);
            grid-template-rows: repeat(6, 55px);
            gap: 8px;
            background-color: var(--board-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.4);
        }

        .cella {
            width: 100%;
            height: 100%;
            background-color: var(--empty-color);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .cella:hover {
            transform: scale(0.92);
        }

        .cella.vermell {
            background-color: var(--p1-color);
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
            cursor: default;
        }

        .cella.groc {
            background-color: var(--p2-color);
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.2);
            cursor: default;
        }

        .guanyadora {
            animation: pampallugues 0.8s infinite alternate;
            border: 3px solid white;
        }

        @keyframes pampallugues {
            from { filter: brightness(1); }
            to { filter: brightness(1.4); transform: scale(1.1); }
        }

        .btn-reiniciar {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            background-color: #0f172a;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }

        .btn-reiniciar:hover {
            background-color: #334155;
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .taulell {
                grid-template-columns: repeat(7, 42px);
                grid-template-rows: repeat(6, 42px);
                gap: 5px;
            }
        }
    </style>
</head>
<body>

    <h1>Quatre en Ratlla</h1>
    
    <div class="config-panel">
        <div class="opcio">
            <label for="mode">Mode de Joc:</label>
            <select id="mode" onchange="canviarMode()">
                <option value="1p">1 Jugador (vs Bot)</option>
                <option value="2p">2 Jugadors (Local)</option>
            </select>
        </div>
        <div class="opcio" id="div-dificultat">
            <label for="dificultat">Dificultat del Bot:</label>
            <select id="dificultat">
                <option value="facil">Fàcil</option>
                <option value="mitja" selected>Mitjà</option>
                <option value="dificil">Difícil</option>
            </select>
        </div>
    </div>

    <div class="estat" id="estat">
        <div class="indicador-torn" id="indicador" style="background-color: var(--p1-color);"></div>
        <span id="text-estat">Torn del Jugador 1 (Vermell)</span>
    </div>

    <div class="taulell" id="taulell"></div>

    <button class="btn-reiniciar" onclick="reiniciarJoc()">Nova Partida</button>

    <script>
        const FILES = 6;
        const COLUMNES = 7;
        const taulellHTML = document.getElementById('taulell');
        const textEstat = document.getElementById('text-estat');
        const indicadorTorn = document.getElementById('indicador');
        const selectorMode = document.getElementById('mode');
        const selectorDificultat = document.getElementById('dificultat');
        const divDificultat = document.getElementById('div-dificultat');

        let matriuJoc = [];
        let jugadorActual = 'vermell'; // 'vermell' (Jugador) o 'groc' (Bot/P2)
        let jocActiu = true;
        let botPensant = false;

        function canviarMode() {
            if (selectorMode.value === '2p') {
                divDificultat.style.display = 'none';
            } else {
                divDificultat.style.display = 'flex';
            }
            reiniciarJoc();
        }

        function crearTaulell() {
            taulellHTML.innerHTML = '';
            matriuJoc = [];

            for (let f = 0; f < FILES; f++) {
                let fila = [];
                for (let c = 0; c < COLUMNES; c++) {
                    fila.push(''); 
                    const cella = document.createElement('div');
                    cella.classList.add('cella');
                    cella.setAttribute('data-fila', f);
                    cella.setAttribute('data-col', c);
                    
                    // Event de clic
                    cella.addEventListener('click', () => {
                        if (!jocActiu || botPensant) return;
                        if (selectorMode.value === '1p' && jugadorActual === 'groc') return;
                        ferMoviment(c);
                    });
                    
                    taulellHTML.appendChild(cella);
                }
                matriuJoc.push(fila);
            }
        }

        function obtenirFilaDisponible(taula, col) {
            for (let f = FILES - 1; f >= 0; f--) {
                if (taula[f][col] === '') return f;
            }
            return -1; // Columna plena
        }

        function ferMoviment(columna) {
            let fila = obtenirFilaDisponible(matriuJoc, columna);
            if (fila === -1) return; // Columna plena

            // Col·loca fitxa a la matriu
            matriuJoc[fila][columna] = jugadorActual;
            
            // Actualitza interfície
            const cellaFisica = document.querySelector(`.cella[data-fila='${fila}'][data-col='${columna}']`);
            cellaFisica.classList.add(jugadorActual);

            // Comprova si la jugada acaba el joc
            if (comprovarVictoria(matriuJoc, fila, columna, jugadorActual, true)) {
                finalitzarJoc(jugadorActual);
            } else if (!matriuJoc[0].includes('')) {
                finalitzarJoc('empat');
            } else {
                canviarJugador();
            }
        }

        function canviarJugador() {
            jugadorActual = jugadorActual === 'vermell' ? 'groc' : 'vermell';
            
            if (jugadorActual === 'vermell') {
                textEstat.innerText = "Torn del Jugador 1 (Vermell)";
                indicadorTorn.style.backgroundColor = "var(--p1-color)";
            } else {
                if (selectorMode.value === '1p') {
                    textEstat.innerText = "L'ordinador està pensant...";
                    indicadorTorn.style.backgroundColor = "var(--p2-color)";
                    botPensant = true;
                    // Retard simulat per donar sensació de joc (entre 0.5s i 1s)
                    const tempsEspera = Math.random() * 500 + 500;
                    setTimeout(tornBot, tempsEspera); 
                } else {
                    textEstat.innerText = "Torn del Jugador 2 (Groc)";
                    indicadorTorn.style.backgroundColor = "var(--p2-color)";
                }
            }
        }

        // --- INTEL·LIGÈNCIA DEL BOT ---
        function tornBot() {
            if (!jocActiu) return;
            
            let columnaEscollida = -1;
            let valides = [];

            // Obtenir columnes on es pot tirar
            for(let c = 0; c < COLUMNES; c++) {
                if(obtenirFilaDisponible(matriuJoc, c) !== -1) valides.push(c);
            }

            const dificultat = selectorDificultat.value;

            if (dificultat === 'facil') {
                columnaEscollida = valides[Math.floor(Math.random() * valides.length)];
            } else {
                columnaEscollida = moureBotIntelligent(valides, dificultat);
            }

            botPensant = false;
            ferMoviment(columnaEscollida);
        }

        function moureBotIntelligent(valides, dificultat) {
            // 1. Puc guanyar ara mateix? (Tant el mitjà com el difícil ho comproven sempre)
            for (let col of valides) {
                let fila = obtenirFilaDisponible(matriuJoc, col);
                matriuJoc[fila][col] = 'groc';
                let guanya = comprovarVictoria(matriuJoc, fila, col, 'groc', false);
                matriuJoc[fila][col] = ''; // desfem
                if (guanya) return col;
            }

            // 2. El jugador està a punt de guanyar? Bloqueja'l!
            let columnaBloqueig = -1;
            for (let col of valides) {
                let fila = obtenirFilaDisponible(matriuJoc, col);
                matriuJoc[fila][col] = 'vermell';
                let perd = comprovarVictoria(matriuJoc, fila, col, 'vermell', false);
                matriuJoc[fila][col] = ''; // desfem
                if (perd) {
                    columnaBloqueig = col;
                    break;
                }
            }

            if (columnaBloqueig !== -1) {
                if (dificultat === 'dificil') {
                    return columnaBloqueig; // El bot difícil SEMPRE bloqueja
                } else if (dificultat === 'mitja') {
                    // El bot mitjà té un 75% de possibilitats de bloquejar-te l'atac.
                    // Així li dóna un toc més "humà" (de vegades s'equivoca)
                    if (Math.random() < 0.75) {
                        return columnaBloqueig;
                    }
                }
            }

            // 3. Tria columna base per defecte si no hi ha perill imminent
            if (dificultat === 'dificil') {
                // El difícil prioritza el centre del taulell
                const ordrePreferencia = [3, 2, 4, 1, 5, 0, 6]; 
                for (let col of ordrePreferencia) {
                    if (valides.includes(col)) return col;
                }
            }
            
            // Si és mode Mitjà, o si el difícil no troba espai (poc probable), llença a l'atzar
            return valides[Math.floor(Math.random() * valides.length)];
        }

        // --- SISTEMA DE VICTORIA ---
        function comprovarVictoria(taula, fila, col, color, ressaltar) {
            const direccions = [
                [[0, 1], [0, -1]], // Horitzontal
                [[1, 0], [-1, 0]], // Vertical
                [[1, 1], [-1, -1]],// Diagonal descendent
                [[1, -1], [-1, 1]] // Diagonal ascendent
            ];

            for (let dir of direccions) {
                let comptador = 1; 
                let cellesGuanyadores = [{f: fila, c: col}];

                for (let direccio of dir) {
                    let f = fila + direccio[0];
                    let c = col + direccio[1];
                    
                    while (f >= 0 && f < FILES && c >= 0 && c < COLUMNES && taula[f][c] === color) {
                        comptador++;
                        cellesGuanyadores.push({f: f, c: c});
                        f += direccio[0];
                        c += direccio[1];
                    }
                }

                if (comptador >= 4) {
                    if (ressaltar) ressaltarVictoria(cellesGuanyadores);
                    return true;
                }
            }
            return false;
        }

        function ressaltarVictoria(celles) {
            celles.forEach(pos => {
                const c = document.querySelector(`.cella[data-fila='${pos.f}'][data-col='${pos.c}']`);
                c.classList.add('guanyadora');
            });
        }

        function finalitzarJoc(resultat) {
            jocActiu = false;
            botPensant = false;
            if (resultat === 'empat') {
                textEstat.innerText = "🤝 Empat total!";
                indicadorTorn.style.display = 'none';
            } else {
                if (selectorMode.value === '1p' && resultat === 'groc') {
                    textEstat.innerText = "🤖 Ha guanyat l'Ordinador!";
                } else if (selectorMode.value === '2p' && resultat === 'groc') {
                    textEstat.innerText = "🎉 Ha guanyat el Jugador 2 (Groc)!";
                } else {
                    textEstat.innerText = "🎉 Has guanyat (Jugador 1)!";
                }
            }
        }

        function reiniciarJoc() {
            jocActiu = true;
            botPensant = false;
            jugadorActual = 'vermell';
            textEstat.innerText = "Torn del Jugador 1 (Vermell)";
            indicadorTorn.style.display = 'inline-block';
            indicadorTorn.style.backgroundColor = "var(--p1-color)";
            crearTaulell();
        }

        // Inicia el taulell per primer cop
        crearTaulell();

    </script>
</body>
</html>
