<title>Plantes vs Robots</title>
<style>
:root{color-scheme:dark;--green:#b5f575;--panel:#152927;--muted:#a6bcb0}
*{box-sizing:border-box}body{margin:0;background:#091715;color:#ecf6ed;font-family:system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid #496253;background:#243d33;border-radius:12px;padding:10px 16px;transition:.15s}
button:hover{background:#355542;transform:translateY(-1px)}button:disabled{opacity:.38;cursor:default;transform:none}
button.primary{background:var(--green);color:#183220;border:0;font-weight:850}
header{max-width:1180px;margin:auto;padding:20px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-weight:950;font-size:24px;letter-spacing:-1px}.logo span{color:var(--green)}
.tag{color:var(--muted);font-size:12px;margin-top:4px;letter-spacing:1px}
.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button{padding:9px 12px;font-size:13px}
main{max-width:1180px;margin:auto;padding:0 20px 20px}

#energy{font-size:25px;font-weight:900;color:#ffe48e;min-width:96px}
#levelLabel{font-weight:800}#waveLabel{font-size:12px;color:var(--muted);margin-top:3px}
.progress{height:8px;background:#0c1e18;border-radius:9px;overflow:hidden;flex:1;min-width:90px}
#progressFill{height:100%;background:var(--green);width:0%;transition:width .3s}
#cards{display:flex;gap:7px;padding:10px;background:#10241e;overflow-x:auto;scrollbar-color:#657c57 #10241e;min-height:110px}
.card{position:relative;flex:0 0 88px;padding:5px 3px 7px;text-align:center;border-radius:10px;overflow:hidden}
.card canvas{display:block;margin:auto;width:44px;height:44px}.card b{font-size:10px;display:block}.card small{font-size:12px;color:#ffdf87}
.card.selected{border:2px solid #d9ff97;background:#466b3e;box-shadow:0 0 13px #9bed7335}.card.poor{opacity:.5}
.cool{position:absolute;inset:auto 0 0;background:#07130dc9;pointer-events:none}.cooltext{position:absolute;top:15px;left:0;right:0;font-weight:900;color:white;text-shadow:0 2px 3px black}
#arena{position:relative;overflow:hidden;border:1px solid #3b5547;border-radius:0 0 16px 16px;background:#1b3528}
#game{display:block;width:100%;touch-action:none}
#hint{padding:12px 4px;color:var(--muted);font-size:13px;min-height:44px}
kbd{background:#294333;padding:2px 6px;border-radius:5px;color:#fff}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e4f4cf;color:#183020;padding:12px 22px;border-radius:12px;z-index:20;box-shadow:0 5px 30px #0007;pointer-events:none;opacity:0;transition:opacity .2s;text-align:center}
#overlay{position:fixed;inset:0;background:#04100ddd;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
#overlay.hidden{display:none}.modal{width:min(850px,100%);max-height:90vh;overflow:auto;background:#173028;border:1px solid #45664e;border-radius:24px;padding:28px;box-shadow:0 30px 100px #0008}
.modal h1{font-size:clamp(32px,6vw,60px);line-height:1.05;letter-spacing:-2px;margin:10px 0 16px}
.modal h2{font-size:30px;margin:0 0 14px}.modal p{color:#bfd1c2;line-height:1.6}.eyebrow{color:#b7f778;letter-spacing:3px;font-size:12px;font-weight:800}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center}.hero canvas{width:100%;max-width:280px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.stats{display:flex;gap:20px;margin-top:24px;color:#b5cbb8;font-size:13px}.stats strong{display:block;color:#d8f8b9;font-size:24px}
.zone{margin:18px 0}.zone h3{font-size:14px;color:#c3d6bb;margin:0 0 9px}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.level{padding:15px 5px;font-weight:900;font-size:21px}.level small{display:block;font-size:10px;font-weight:500;margin-top:5px;color:#c7d8c3}.level.done{border-color:#b2e777}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}
.entry{padding:13px;border:1px solid #3d5a48;border-radius:12px;background:#10271f}.entry canvas{float:left;margin-right:10px}.entry b{font-size:13px}.entry p{font-size:12px;line-height:1.5;margin:8px 0 0;clear:both;padding-top:6px}
.tabs{display:flex;gap:8px;margin-bottom:16px}.introbox{padding:15px;background:#0b2119;border-radius:14px;color:#c8d8bd;line-height:1.6}
@media(max-width:650px){header{padding:12px}.logo{font-size:19px}.tag{font-size:9px}main{padding:0 6px 10px}.tools button{padding:8px;font-size:11px}.hero{grid-template-columns:1fr}.hero canvas{display:none}.modal{padding:20px}#hud{gap:8px;padding:10px}#energy{font-size:21px}.card{flex-basis:78px}#hint{font-size:11px}}
</style>
</head>

function beep(freq=420,dur=.08,type="sine",vol=.04){
 if(!sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch{}
}

 g.save();g.translate(x,y);g.scale(s,s);g.rotate(Math.sin(t*2+x)*.025);

 if(k==="sun"||k==="gold"||k==="heal"||k==="laser"||k==="magnet"){
 for(let i=0;i<10;i++){let a=i*Math.PI/5;ellipse(g,Math.cos(a)*22,Math.sin(a)*22-8,9,10,p.color)}
 circle(g,0,-8,19,k==="sun"||k==="gold"?"#9b682e":p.color);

 }else if(k==="mine"){

function icon(p,robot=false,size=48){
 const c=document.createElement("canvas");c.width=size*2;c.height=size*2;c.style.width=size+"px";c.style.height=size+"px";
 const g=c.getContext("2d");g.scale(2,2);(robot?robotArt:plantArt)(g,p,size/2,size*.58,size/78,0);return c;
}
function modal(html){$("#modal").innerHTML=html;$("#overlay").classList.remove("hidden")}
function closeModal(){$("#overlay").classList.add("hidden")}

 modal(`<div class="hero"><div><div class="eyebrow">DEFENSA EL QUE ÉS VIU</div><h1>Un jardí.<br>Mil peces<br>de ferralla.</h1><p>Construeix un exèrcit de plantes, recull energia solar i frena la invasió dels robots en una campanya de 30 nivells.</p><div class="actions"><button class="primary" id="go">Jugar · Nivell ${progress}</button><button id="choose">Mapa</button><button id="guide">Com es juga</button></div></div><canvas id="heroArt" width="300" height="300"></canvas></div><div class="stats"><div><strong>30</strong>nivells</div><div><strong>18</strong>plantes</div><div><strong>14</strong>robots</div><div><strong>6</strong>escenaris</div></div>`);
 const g=$("#heroArt").getContext("2d");circle(g,150,150,132,"#284934");circle(g,150,150,112,"#365a3c");plantArt(g,plants[1],85,180,1.5,0);robotArt(g,robots[13],220,174,1.5,0);

 modal(`<div class="eyebrow">MANUAL DE CAMP</div><h2>Salva el jardí</h2><div class="introbox">1. Planta <b>gira-sols</b> per produir energia i toca els sols per recollir-la.<br>2. Selecciona una carta i toca una casella buida.<br>3. Els robots entren per la dreta. Posa atacants al darrere i barreres al davant.<br>4. Cada fila té un tallagespa d'emergència d'un sol ús.<br>5. Guanya eliminant totes les onades. Si un robot travessa una fila sense tallagespa, perds.<br>6. La pala retira plantes i retorna el 50% del cost.<br><br><b>Teclat:</b> espai = pausa · Esc = cancel·lar selecció · 1–9 = seleccionar planta · S = pala.<br><b>Progrés:</b> es desa automàticament en aquest navegador. Pots repetir els nivells superats.</div><div class="actions"><button class="primary" id="back">Entès!</button><button id="download">Descarrega l'HTML</button></div>`);

function download(){
 const text="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
 const a=document.createElement("a"),u=URL.createObjectURL(new Blob([text],{type:"text/html"}));a.href=u;a.download="Plantes-vs-Robots.html";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);

 zones.forEach((z,zi)=>{html+=`<div class="zone"><h3>${zi+1}. ${z.name}</h3><div class="levels">`;
 for(let i=zi*5+1;i<=zi*5+5;i++)html+=`<button class="level ${won.includes(i)?"done":""}" data-level="${i}" ${i>progress?"disabled":""}>${i>progress?"🔒":i}<small>${won.includes(i)?"SUPERAT":i%5===0?"CAP FINAL":"NIVELL"}</small></button>`;
 html+="</div></div>"});
 html+=`<div class="actions"><button id="back">Torna</button><button id="download">Descarrega l'HTML</button></div>`;
 modal(html);document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>brief(+b.dataset.level));
 $("#back").onclick=()=>state==="playing"?closeModal():mainMenu();$("#download").onclick=download;

 modal(`<div class="eyebrow">ARXIU DEL JARDÍ</div><h2>Els personatges</h2><div class="tabs"><button id="pTab" class="${tab==="plants"?"primary":""}">18 plantes</button><button id="rTab" class="${tab==="robots"?"primary":""}">14 robots</button></div><div class="catalog">${list.map((p,i)=>`<div class="entry" data-entry="${i}"><b>${p.name}</b><div style="font-size:11px;color:#e7d591;margin-top:5px">${tab==="plants"?p.cost+" sols · ":""}Nivell ${p.unlock}</div><p>${p.desc}</p></div>`).join("")}</div><div class="actions"><button id="back">Torna</button></div>`);
 document.querySelectorAll("[data-entry]").forEach(e=>e.prepend(icon(list[+e.dataset.entry],tab==="robots")));
 $("#pTab").onclick=()=>book("plants");$("#rTab").onclick=()=>book("robots");$("#back").onclick=()=>state==="playing"?closeModal():mainMenu();

function brief(n){
 const z=zones[Math.floor((n-1)/5)],newP=plants.filter(p=>p.unlock===n),newR=robots.filter(p=>p.unlock===n);
 modal(`<div class="eyebrow">NIVELL ${n} / 30 · ${z.name}</div><h2>${titles[n-1]}</h2><p>${n%5===0?"El Rei Ferralla arribarà amb l'última onada. Prepara una defensa potent!":"Prepara el jardí abans de l'arribada de les onades."}</p><div class="introbox">${z.rule==="night"?"BOIRA NOCTURNA: cauen menys sols del cel. Protegeix els gira-sols.":z.rule==="sun"?"DESERT SOLAR: els sols del cel valen 35.":z.rule==="ice"?"FRED POLAR: robots i projectils es mouen un 12% més lentament.":z.rule==="final"?"CIUTADELLA: onades més nombroses i robots més resistents.":"DIA CLAR: condicions ideals per fer créixer la defensa."}<br><br>${newP.length?"Nova planta: <b>"+newP.map(p=>p.name).join(", ")+"</b><br>":""}${newR.length?"Nou enemic: <b>"+newR.map(p=>p.name).join(", ")+"</b><br>":""}Energia inicial: <b>${startEnergy(n)} sols</b> · ${wavesFor(n)} onades</div><div class="actions"><button class="primary" id="start">A defensar!</button><button id="back">Mapa</button></div>`);
 $("#start").onclick=()=>startLevel(n);$("#back").onclick=showMap;

function startEnergy(n){return 225+Math.floor((n-1)/5)*25}
function wavesFor(n){return 3+Math.floor((n-1)/10)}
function startLevel(n){
 level=n;state="playing";time=0;energy=startEnergy(n);units=[];enemies=[];shots=[];suns=[];effects=[];cds={};spawnQueue=[];
 mowers=Array.from({length:5},(_,r)=>({r,x:74,used:false,active:false}));
 wave=0;totalWaves=wavesFor(n);nextWave=16;nextSun=4;kills=0;spawned=0;paused=false;selected="pea";
 $("#pauseBtn").textContent="Pausa";$("#shovelBtn").classList.remove("primary");closeModal();buildCards();updateHUD();
 notify("Planta gira-sols i prepara les cinc files!");
}
function buildCards(){
 $("#cards").innerHTML="";
 plants.filter(p=>p.unlock<=level).forEach(p=>{
 const b=document.createElement("button");b.className="card";b.dataset.id=p.id;b.title=p.name+" — "+p.desc;
 b.append(icon(p,false,44));const name=document.createElement("b");name.textContent=p.name;b.append(name);
 const cost=document.createElement("small");cost.textContent="☀ "+p.cost;b.append(cost);
 const cool=document.createElement("div");cool.className="cool";b.append(cool);const txt=document.createElement("span");txt.className="cooltext";b.append(txt);
 b.onclick=()=>{selected=p.id;$("#shovelBtn").classList.remove("primary");$("#hint").textContent=p.name+" · "+p.cost+" sols — "+p.desc;updateHUD()};$("#cards").append(b);
 });
}
function updateHUD(){
 $("#energy").textContent="☀ "+Math.floor(energy);
 $("#levelLabel").textContent=`${level}. ${titles[level-1]}`;
 $("#waveLabel").textContent=state==="playing"?`Onada ${wave}/${totalWaves} · ${kills} robots eliminats${wave<totalWaves?" · següent en "+Math.max(0,Math.ceil(nextWave-time))+" s":""}`:"Construeix la teva defensa";
 $("#progressFill").style.width=(wave/totalWaves*100)+"%";
 document.querySelectorAll(".card").forEach(b=>{
 const p=plants.find(p=>p.id===b.dataset.id),cool=cds[p.id]||0;
 b.classList.toggle("selected",selected===p.id);b.classList.toggle("poor",energy<p.cost);
 b.querySelector(".cool").style.height=Math.min(100,cool/p.cd*100)+"%";
 b.querySelector(".cooltext").textContent=cool>0?Math.ceil(cool)+"s":"";
 });

function addSun(x,y,value=25,sky=false){suns.push({x,y:sky?-15:y,target:y,value,life:14,phase:rand(0,6),sky})}
function fx(x,y,color,text="",radius=25,life=.6){effects.push({x,y,color,text,radius,life,max:life})}
function spawn(type,r,x=990){
 const b=robots.find(b=>b.id===type),scale=1+(level-1)*.017;
 const hp=b.hp*scale*(type==="boss"?(1+(level/5-1)*.18):1);
 enemies.push({...b,x,r,hp,max:hp,shield:b.shield||0,slow:0,poison:0,timer:0,special:type==="factory"?10:4,jumped:false,flash:0,seed:Math.random()*20});
 spawned++;
}
function makeWave(){
 wave++;beep(160,.25,"sawtooth",.04);
 notify(wave===totalWaves?"ÚLTIMA ONADA!":"ONADA "+wave);
 const pool=robots.filter(b=>b.unlock<=level&&b.id!=="boss");
 const count=3+Math.floor(level*.32)+wave+(level>25?2:0);
 let first=Math.floor(Math.random()*5);
 for(let i=0;i<count;i++){
 let type=choice(pool).id;
 if(level===1)type="tin";
 spawnQueue.push({at:time+i*1.4,type,r:(first+i*2)%5});
 }
 if(level%5===0&&wave===totalWaves)spawnQueue.push({at:time+3,type:"boss",r:2});
 nextWave=time+29+Math.min(level*.18,5);
}
function damage(b,d,ignore=false){
 if(b.hp<=0)return;
 if(b.shield>0&&!ignore){const a=Math.min(b.shield,d);b.shield-=a;d-=a}
 b.hp-=d;b.flash=.1;
 if(b.hp<=0){kills++;energy+=b.id==="boss"?100:5;fx(b.x,rowY(b.r),b.color,"",35,.45);beep(100+Math.random()*90,.07,"triangle",.025)}
}
function shoot(p,r,damageAmount,kind){
 shots.push({x:p.x+25,y:rowY(r)-10,r,v:kind==="pierce"?360:260,damage:damageAmount,kind,color:p.def.color,hit:new Set(),life:6});
 beep(460+Math.random()*150,.025,"sine",.015);
}
function attack(p){
 const d=p.def,k=d.kind,near=enemies.filter(b=>b.hp>0&&b.x>p.x-25);
 if(k==="sun"||k==="gold"){addSun(p.x+rand(-16,16),rowY(p.r)-20,k==="gold"?60:25);return}
 if(k==="heal"){
 units.filter(a=>Math.abs(a.c-p.c)<=1&&Math.abs(a.r-p.r)<=1).forEach(a=>{a.hp=Math.min(a.def.hp,a.hp+d.damage);fx(a.x,rowY(a.r),"#b8ffc8","+",14,.5)});return;
 }
 if(k==="magnet"){
 const targets=enemies.filter(b=>b.hp>0&&Math.abs(b.x-p.x)<250&&Math.abs(b.r-p.r)<=1).sort((a,b)=>b.shield-a.shield);
 if(targets.length){targets[0].shield=0;damage(targets[0],d.damage,true);effects.push({line:true,x:p.x,y:rowY(p.r),x2:targets[0].x,y2:rowY(targets[0].r),color:d.color,life:.35,max:.35})}return;
 }
 if(k==="oak"||k==="dragon"){
 const targets=enemies.filter(b=>b.hp>0&&Math.abs(b.r-p.r)<=(k==="dragon"?1:0)&&b.x>p.x-35&&b.x<p.x+(k==="dragon"?195:85));
 if(targets.length){targets.forEach(b=>damage(b,d.damage));fx(p.x+65,rowY(p.r),d.color,"",k==="dragon"?85:25,.3)}return;
 }
 const rows=k==="triple"?[p.r-1,p.r,p.r+1].filter(r=>r>=0&&r<5):[p.r];
 rows.forEach(r=>{
 if(!near.some(b=>b.r===r))return;
 if(k==="laser"){
 near.filter(b=>b.r===r).forEach(b=>damage(b,d.damage));
 effects.push({line:true,x:p.x+10,y:rowY(r)-10,x2:1000,y2:rowY(r)-10,color:d.color,life:.23,max:.23});beep(680,.13,"sawtooth",.018);
 }else shoot(p,r,d.damage,k);
 });
}
function explode(p,kind){
 const d=p.def;
 enemies.forEach(b=>{
 if(b.hp>0&&(kind==="pepper"?b.r===p.r:Math.abs(b.r-p.r)<=1&&Math.abs(b.x-p.x)<150))damage(b,d.damage);
 });
 if(kind==="pepper")effects.push({line:true,x:X,y:rowY(p.r),x2:1010,y2:rowY(p.r),color:"#ff934d",life:.8,max:.8,wide:true});
 else fx(p.x,rowY(p.r),"#ffe38a","BOOM",125,.8);
 p.hp=0;beep(65,.3,"sawtooth",.07);
}
function step(dt){
 time+=dt;
 for(const id in cds)cds[id]=Math.max(0,cds[id]-dt);
 const zone=zones[Math.floor((level-1)/5)],ice=zone.rule==="ice"?.88:1;
 if(time>=nextSun){addSun(rand(160,930),rand(115,450),zone.rule==="sun"?35:25,true);nextSun=time+(zone.rule==="night"?10:6)}
 if(wave<totalWaves&&time>=nextWave)makeWave();
 const due=spawnQueue.filter(s=>s.at<=time);spawnQueue=spawnQueue.filter(s=>s.at>time);due.forEach(s=>spawn(s.type,s.r));
 for(const s of suns){s.life-=dt;if(s.sky)s.y=Math.min(s.target,s.y+95*dt)}
 suns=suns.filter(s=>s.life>0);
 for(const p of units){
 if(p.hp<=0)continue;p.age+=dt;p.chill=Math.max(0,p.chill-dt);p.timer-=dt*(p.chill>0?.6:1);
 const k=p.def.kind;
 if((k==="bomb"||k==="pepper")&&p.age>=p.def.rate)explode(p,k);
 else if(k==="mine"){
 if(p.age>7&&enemies.some(b=>b.hp>0&&b.r===p.r&&Math.abs(b.x-p.x)<40))explode(p,k);
 }else if(k!=="wall"&&p.timer<=0){attack(p);p.timer=p.def.rate}
 }
 const snapshot=[...enemies];
 for(const b of snapshot){
 if(b.hp<=0)continue;b.slow=Math.max(0,b.slow-dt);b.flash=Math.max(0,b.flash-dt);
 if(b.poison>0){b.poison-=dt;damage(b,20*dt,true);if(b.hp<=0)continue}
 const rate=(b.slow>0&&b.id!=="frost"?.5:1)*(b.id==="rage"&&b.hp<b.max/2?1.65:1);
 b.timer-=dt*rate;b.special-=dt;
 if(b.id==="medic"&&b.special<=0){
 enemies.filter(a=>a.hp>0&&Math.abs(a.x-b.x)<150&&Math.abs(a.r-b.r)<=1).forEach(a=>{a.hp=Math.min(a.max,a.hp+45);fx(a.x,rowY(a.r),"#b7ffd7","+",15,.5)});b.special=4;
 }
 if((b.id==="factory"||b.id==="boss")&&b.special<=0){
 spawn("tin",b.id==="boss"?(b.r+choice([-1,1])+5)%5:b.r,Math.min(990,b.x+45));b.special=b.id==="boss"?10:12;fx(b.x,rowY(b.r),"#dec8ff","+",30,.4);
 }
 const inLane=units.filter(p=>p.hp>0&&p.r===b.r&&p.x<=b.x+30).sort((a,c)=>c.x-a.x);
 const target=inLane[0];
 if(target&&b.id==="jumper"&&!b.jumped&&b.x-target.x<83){
 b.jumped=true;b.x=Math.max(X-30,target.x-65);fx(b.x,rowY(b.r),"#ffeb8a","SALT!",25,.6);continue;
 }
 const ranged=b.id==="sniper"&&target&&b.x-target.x<330&&b.x-target.x>60;
 if(ranged){
 if(b.timer<=0){shots.push({enemy:true,x:b.x-25,y:rowY(b.r)-5,r:b.r,v:-230,damage:b.dmg,color:"#ffa4e0",life:6});b.timer=2.4}
 }else if(target&&b.x-target.x<53&&b.x-target.x>-31){
 if(b.timer<=0){target.hp-=b.dmg;target.hit=.15;if(b.id==="frost")target.chill=2;b.timer=.7;fx(target.x+18,rowY(b.r),"#fff3bd","",10,.15)}
 }else b.x-=b.speed*rate*ice*dt;
 if(b.x<X-30){
 const mower=mowers[b.r];
 if(!mower.used){mower.used=true;mower.active=true;beep(70,.3,"sawtooth",.05);notify("Tallagespa d'emergència · fila "+(b.r+1))}
 else if(!mower.active&&b.x<36){finish(false);return}
 }
 }
 for(const s of shots){
 s.x+=s.v*ice*dt;s.life-=dt;
 if(s.enemy){
 const target=units.filter(p=>p.hp>0&&p.r===s.r&&Math.abs(p.x-s.x)<24)[0];
 if(target){target.hp-=s.damage;s.life=0;fx(s.x,s.y,s.color,"",13,.2)}
 }else{
 const hit=enemies.filter(b=>b.hp>0&&b.r===s.r&&Math.abs(b.x-s.x)<27&&!s.hit.has(b)).sort((a,b)=>a.x-b.x)[0];
 if(hit){
 damage(hit,s.damage);s.hit.add(hit);
 if(s.kind==="ice"&&hit.id!=="frost")hit.slow=3.5;
 if(s.kind==="poison")hit.poison=6;
 if(s.kind==="splash"){enemies.filter(b=>b!==hit&&b.hp>0&&Math.abs(b.x-hit.x)<95&&Math.abs(b.r-hit.r)<=1).forEach(b=>damage(b,s.damage*.65));fx(hit.x,s.y,"#ffdb74","",65,.4)}
 else fx(s.x,s.y,s.color,"",12,.18);
 if(s.kind!=="pierce"||s.hit.size>=3)s.life=0;
 }
 }
 }
 for(const m of mowers){
 if(m.active){m.x+=430*dt;enemies.filter(b=>b.r===m.r&&b.hp>0&&Math.abs(b.x-m.x)<70).forEach(b=>damage(b,99999,true));if(m.x>1100)m.active=false}
 }
 shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<1060);
 units=units.filter(p=>p.hp>0);enemies=enemies.filter(b=>b.hp>0);
 effects.forEach(e=>e.life-=dt);effects=effects.filter(e=>e.life>0);
 if(wave===totalWaves&&!spawnQueue.length&&!enemies.length)finish(true);
 uiClock+=dt;if(uiClock>.15){updateHUD();uiClock=0}
}
function finish(win){
 state=win?"won":"lost";
 if(win){if(!won.includes(level))won.push(level);progress=Math.max(progress,Math.min(30,level+1));save();beep(740,.2);setTimeout(()=>beep(980,.3),180)}
 else beep(110,.5,"triangle",.08);
 const nextPlant=plants.filter(p=>p.unlock===level+1);
 modal(`<div class="eyebrow">${win?"JARDÍ PROTEGIT":"LA FERRALLA HA PASSAT"}</div><h1>${win?(level===30?"Has salvat<br>el món verd!":"Victòria! 🌿"):"Torna a<br>plantar cara."}</h1><p>${win?`Has superat el nivell ${level} i has eliminat ${kills} robots.`:"Els robots han travessat la defensa. Prova de plantar més gira-sols al principi i protegir els atacants amb nous."}</p>${win&&nextPlant.length?`<div class="introbox">Al següent nivell desbloqueges: <b>${nextPlant.map(p=>p.name).join(", ")}</b>.</div>`:""}<div class="actions">${win&&level<30?`<button class="primary" id="next">Nivell ${level+1}</button>`:""}<button id="retry" class="${!win?"primary":""}">Repetir nivell</button><button id="map">Mapa</button><button id="download">Descarrega l'HTML</button></div>`);
 if($("#next"))$("#next").onclick=()=>brief(level+1);$("#retry").onclick=()=>startLevel(level);$("#map").onclick=showMap;$("#download").onclick=download;
}
function health(x,y,w,p,color){
 box(ctx,x-w/2,y,w,5,2,"#14261ad9");if(p>0)box(ctx,x-w/2,y,w*Math.min(1,p),5,2,color);
}

 ctx.fillStyle="#112b2588";ctx.fillRect(0,0,W,61);ctx.fillStyle="#e3edca";ctx.font="bold 15px system-ui";ctx.fillText(z.name.toUpperCase(),26,30);
 ctx.font="12px system-ui";ctx.fillStyle="#d8e6c6";ctx.fillText(state==="playing"?"DEFENSA  ←  ROBOTS ENTREN PER LA DRETA":"30 NIVELLS · 18 PLANTES · 14 ROBOTS",26,49);
 ctx.fillStyle="#223d32";ctx.fillRect(0,61,110,459);
 for(let r=0;r<5;r++)for(let c=0;c<9;c++){
 const x=X+c*CW,y=Y+r*CH;
 ctx.fillStyle=(c+r)%2?z.tile:z.bg;ctx.fillRect(x,y,CW,CH);
 ctx.strokeStyle="#d6e5b51a";ctx.strokeRect(x+.5,y+.5,CW-1,CH-1);
 ctx.fillStyle="#d4e6ac20";
 for(let i=0;i<3;i++){const gx=x+17+i*29,gy=y+62+(c*7+r*11+i*3)%15;ctx.fillRect(gx,gy,2,5);ctx.fillRect(gx+3,gy-3,2,8)}
 }

 if(state==="playing"&&pointer.c>=0&&pointer.c<9&&pointer.r>=0&&pointer.r<5){
 ctx.fillStyle=selected==="shovel"?"#ffd3ac44":"#d4ff9540";ctx.fillRect(X+pointer.c*CW,Y+pointer.r*CH,CW,CH);
 }
 const mowerList=mowers.length?mowers:Array.from({length:5},(_,r)=>({x:74,r,used:false}));
 for(const m of mowerList)if(!m.used||m.active){
 const y=rowY(m.r);ellipse(ctx,m.x,y+23,28,7,"#0a211d66");circle(ctx,m.x-17,y+16,9,"#152d29");circle(ctx,m.x+17,y+16,9,"#152d29");box(ctx,m.x-26,y-3,52,22,5,"#e6a45b");box(ctx,m.x-15,y-17,28,20,4,"#efc27e");ctx.strokeStyle="#344c47";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(m.x-22,y);ctx.lineTo(m.x-34,y-29);ctx.stroke();
 }
 for(let r=0;r<5;r++){
 units.filter(p=>p.r===r).forEach(p=>{
 plantArt(ctx,p.def,p.x,rowY(r),.86,time+p.age);
 if(p.hp<p.def.hp)health(p.x,rowY(r)+33,45,p.hp/p.def.hp,"#b2ec80");
 if(p.def.kind==="mine"&&p.age<7){ctx.fillStyle="#fff3c7";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(Math.ceil(7-p.age)+"s",p.x,rowY(r)-30);ctx.textAlign="left"}
 if(p.chill>0){circle(ctx,p.x-22,rowY(r)-24,6,"#cdf5ff")}
 });
 enemies.filter(b=>b.r===r).sort((a,b)=>a.x-b.x).forEach(b=>{
 ctx.save();if(b.flash>0)ctx.globalAlpha=.65;
 const scale=b.id==="boss"?1.3:b.id==="titan"?1.12:.83;
 robotArt(ctx,b,b.x,rowY(r),scale,time+b.seed);ctx.restore();
 if(b.slow>0){ctx.strokeStyle="#a9f4ff";ctx.lineWidth=2;ctx.strokeRect(b.x-25,rowY(r)-38,50,66)}
 if(b.poison>0)circle(ctx,b.x+21,rowY(r)-27,6,"#b76cec");
 health(b.x,rowY(r)-45*scale,50,b.hp/b.max,b.id==="boss"?"#ffb470":"#ee9b8d");
 if(b.shield>0)health(b.x,rowY(r)-51*scale,50,b.shield/(robots.find(a=>a.id===b.id).shield||1),"#c7f4ff");
 });
 }
 for(const s of shots){
 if(s.kind==="pierce"){box(ctx,s.x-11,s.y-2,22,4,2,"#e9facd")}
 else{circle(ctx,s.x,s.y,s.enemy?5:s.kind==="splash"?9:7,s.color);circle(ctx,s.x-2,s.y-2,2,"#ffffffbb")}
 }
 for(const e of effects){
 ctx.save();ctx.globalAlpha=Math.max(0,e.life/e.max);
 if(e.line){ctx.strokeStyle=e.color;ctx.lineWidth=e.wide?54:5;ctx.shadowColor=e.color;ctx.shadowBlur=15;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(e.x2,e.y2);ctx.stroke()}
 else{const k=1-e.life/e.max;ctx.strokeStyle=e.color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(e.x,e.y,Math.max(2,e.radius*k),0,Math.PI*2);ctx.stroke();if(e.text){ctx.fillStyle=e.color;ctx.font="bold 19px system-ui";ctx.textAlign="center";ctx.fillText(e.text,e.x,e.y-15*k)}}
 ctx.restore();
 }
 for(const s of suns){
 ctx.save();ctx.globalAlpha=Math.min(1,s.life/2);const y=s.y+Math.sin(time*3+s.phase)*3;
 ctx.shadowColor="#ffdf65";ctx.shadowBlur=16;circle(ctx,s.x,y,19,"#ffcb4e");ctx.shadowBlur=0;
 ctx.strokeStyle="#fff098";ctx.lineWidth=3;for(let i=0;i<8;i++){const a=i*Math.PI/4+time*.4;ctx.beginPath();ctx.moveTo(s.x+Math.cos(a)*23,y+Math.sin(a)*23);ctx.lineTo(s.x+Math.cos(a)*28,y+Math.sin(a)*28);ctx.stroke()}
 ctx.fillStyle="#79551e";ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillText(s.value,s.x,y+4);ctx.restore();
 }
 if(paused&&state==="playing"){
 ctx.fillStyle="#08221bb8";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ecf4dc";ctx.textAlign="center";ctx.font="900 42px system-ui";ctx.fillText("PAUSA",W/2,H/2);ctx.font="16px system-ui";ctx.fillText("Prem espai o el botó per continuar",W/2,H/2+35);ctx.textAlign="left";
 }
}
function coords(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener("pointermove",e=>{const p=coords(e);pointer={c:Math.floor((p.x-X)/CW),r:Math.floor((p.y-Y)/CH)}});
cv.addEventListener("pointerleave",()=>pointer={c:-1,r:-1});
cv.addEventListener("pointerdown",e=>{
 e.preventDefault();if(state!=="playing"||paused||!$("#overlay").classList.contains("hidden"))return;
 const p=coords(e),sun=suns.find(s=>Math.hypot(s.x-p.x,s.y-p.y)<35);
 if(sun){energy+=sun.value;sun.life=0;suns=suns.filter(s=>s.life>0);fx(sun.x,sun.y,"#fff0a1","+"+sun.value,20,.6);beep(880,.1);updateHUD();return}
 const c=Math.floor((p.x-X)/CW),r=Math.floor((p.y-Y)/CH);if(c<0||c>=9||r<0||r>=5)return;
 const existing=units.find(p=>p.c===c&&p.r===r);
 if(selected==="shovel"){
 if(existing){energy+=Math.floor(existing.def.cost/2);units=units.filter(p=>p!==existing);fx(center(c),rowY(r),"#d5eabf","",28,.4);updateHUD()}return;
 }
 const def=plants.find(p=>p.id===selected);if(!def)return;
 if(existing){notify("Aquesta casella ja té una planta.");return}
 if((cds[def.id]||0)>0){notify("La planta s'està recuperant.");return}
 if(energy<def.cost){notify("Necessites més sols.");return}
 energy-=def.cost;cds[def.id]=def.cd;
 units.push({def,c,r,x:center(c),hp:def.hp,age:0,timer:def.kind==="sun"||def.kind==="gold"?def.rate*.6:.4,chill:0});
 fx(center(c),rowY(r),"#ccf69c","",32,.35);beep(330,.07,"triangle");updateHUD();
});
function togglePause(){if(state!=="playing")return;paused=!paused;$("#pauseBtn").textContent=paused?"Continua":"Pausa"}
$("#pauseBtn").onclick=togglePause;
$("#speedBtn").onclick=()=>{speed=speed===1?2:1;$("#speedBtn").textContent="Velocitat ×"+speed};
$("#soundBtn").onclick=()=>{sound=!sound;$("#soundBtn").textContent="So: "+(sound?"ON":"OFF");if(sound)beep(600,.12)};
$("#mapBtn").onclick=showMap;$("#bookBtn").onclick=()=>book();
$("#shovelBtn").onclick=()=>{selected=selected==="shovel"?"pea":"shovel";$("#shovelBtn").classList.toggle("primary",selected==="shovel");$("#hint").textContent=selected==="shovel"?"Toca una planta per retirar-la i recuperar el 50% del cost.":"Selecciona una planta i toca una casella.";updateHUD()};
document.addEventListener("keydown",e=>{
 if(!$("#overlay").classList.contains("hidden"))return;
 if(e.code==="Space"){e.preventDefault();togglePause()}
 if(e.key==="Escape"){selected=null;$("#shovelBtn").classList.remove("primary");updateHUD()}
 if(e.key.toLowerCase()==="s")$("#shovelBtn").click();
 const n=Number(e.key);if(n>=1&&n<=9){const b=document.querySelectorAll(".card")[n-1];if(b)b.click()}
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="playing"&&!paused)togglePause()});
function loop(now){
 const elapsed=Math.min((now-last)/1000,.08);last=now;
 if(state==="playing"&&!paused&&$("#overlay").classList.contains("hidden")){
 let remain=elapsed*speed;while(remain>0&&state==="playing"){const dt=Math.min(remain,1/60);step(dt);remain-=dt}
 }
 draw();requestAnimationFrame(loop);
}
buildCards();mainMenu();requestAnimationFrame(loop);
</script>
</body>
