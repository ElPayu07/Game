<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasors Espacials - Colors per Files</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #05070d;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .hud div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud span {
            color: #38bdf8;
        }

        canvas {
            background-color: #020617;
            max-width: 100vw;
            max-height: calc(100vh - 60px);
            width: auto;
            height: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            margin-top: 30px;
        }

        .instruccions-flotants {
            position: absolute;
            bottom: 8px;
            font-size: 0.8em;
            color: #64748b;
            background: rgba(15, 23, 42, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div>Punts: <span id="txt-punts">0</span></div>
        <div>Vides: <span id="txt-vides">❤️ ❤️ ❤️</span></div>
        <div>Rècord: <span id="txt-record">0</span></div>
    </div>

    <canvas id="canvas" width="900" height="650"></canvas>

    <div class="instruccions-flotants">
        Mou-te amb <b>Fletxes / A-D</b> | Dispara amb <b>Espai</b> | Destrueix el cub blau (3 vides) per aconseguir Escut i Potència!
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const txtPunts = document.getElementById('txt-punts');
        const txtVides = document.getElementById('txt-vides');
        const txtRecord = document.getElementById('txt-record');

        let punts = 0;
        let vides = 3;
        let record = localStorage.getItem('espai_record_full_files') || 0;
        txtRecord.innerText = record;

        let jocActiu = true;
        let missatgePantalla = "Prem ESPAI per Començar";

        const tecles = {};
        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (!jocActiu) reiniciarJoc();
                else disparar();
                e.preventDefault();
            }
            tecles[e.code] = true;
        });
        window.addEventListener('keyup', e => tecles[e.code] = false);

        const jugador = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 50,
            amplada: 60,
            alcada: 24,
            velocitat: 6
        };

        let bales = [];
        let balesEnreres = [];
        let invasors = [];
        let direccioInvasors = 1;

        let cubEnergia = null;
        let temporitzadorCub = 0;
        let tempsProximCub = recapturarTempsCub();

        let powerUpActiu = false;
        let teEscut = false;
        let tempsPowerUpFi = 0;

        function recapturarTempsCub() {
            return Math.floor(Math.random() * 300) + 1500;
        }

        function reiniciarJoc() {
            punts = 0;
            vides = 3;
            jocActiu = true;
            bales = [];
            balesEnreres = [];
            powerUpActiu = false;
            teEscut = false;
            temporitzadorCub = 0;
            tempsProximCub = recapturarTempsCub();
            crearInvasors();
            actualitzarUI();
        }

        function crearInvasors() {
            invasors = [];
            const files = 5; // 5 files en total
            const columnes = 9;
            const espaiX = 80;
            const iniciX = (canvas.width - (columnes * espaiX)) / 2;

            for (let f = 0; f < files; f++) {
                // Definir color segons la distància al jugador (f = 4 i f = 3 són les més properes)
                let colorInv = '#ef4444'; // Vermella per defecte (més llunyana, f = 0)
                if (f === 1 || f === 2) {
                    colorInv = '#f97316'; // Taronges (files intermèdies)
                } else if (f === 3 || f === 4) {
                    colorInv = '#22c55e'; // Verdes (dues files més properes al jugador)
                }

                for (let c = 0; c < columnes; c++) {
                    invasors.push({
                        x: iniciX + c * espaiX,
                        y: 60 + f * 45,
                        amplada: 45,
                        alcada: 28,
                        viu: true,
                        color: colorInv
                    });
                }
            }
        }

        function disparar() {
            if (!jocActiu) return;
            let midaBala = powerUpActiu ? 10 : 5;
            let velBala = powerUpActiu ? 11 : 7.5;
            
            bales.push({
                x: jugador.x + jugador.amplada / 2 - midaBala / 2,
                y: jugador.y,
                radi: midaBala,
                vel: velBala
            });
        }

        function actualitzarUI() {
            txtPunts.innerText = punts;
            let cors = "";
            for (let i = 0; i < vides; i++) cors += "❤️ ";
            txtVides.innerText = cors.trim();
        }

        function actualitzar() {
            if (!jocActiu) return;

            if ((tecles['ArrowLeft'] || tecles['KeyA']) && jugador.x > 15) {
                jugador.x -= jugador.velocitat;
            }
            if ((tecles['ArrowRight'] || tecles['KeyD']) && jugador.x < canvas.width - jugador.amplada - 15) {
                jugador.x += jugador.velocitat;
            }

            if (powerUpActiu && Date.now() > tempsPowerUpFi) {
                powerUpActiu = false;
                teEscut = false;
            }

            if (!cubEnergia) {
                temporitzadorCub++;
                if (temporitzadorCub >= tempsProximCub) {
                    cubEnergia = {
                        x: Math.random() * (canvas.width - 60),
                        y: 50,
                        amplada: 45,
                        alcada: 45,
                        vides: 3,
                        velY: 1.2
                    };
                    temporitzadorCub = 0;
                    tempsProximCub = recapturarTempsCub();
                }
            } else {
                cubEnergia.y += cubEnergia.velY;
                if (cubEnergia.y > 180 || cubEnergia.y < 40) cubEnergia.velY *= -1;
            }

            for (let i = bales.length - 1; i >= 0; i--) {
                bales[i].y -= bales[i].vel;

                if (cubEnergia && 
                    bales[i].x > cubEnergia.x && bales[i].x < cubEnergia.x + cubEnergia.amplada &&
                    bales[i].y > cubEnergia.y && bales[i].y < cubEnergia.y + cubEnergia.alcada) {
                    
                    cubEnergia.vides--;
                    bales.splice(i, 1);

                    if (cubEnergia.vides <= 0) {
                        powerUpActiu = true;
                        teEscut = true;
                        tempsPowerUpFi = Date.now() + 7000;
                        cubEnergia = null;
                    }
                    continue;
                }

                let eliminatBala = false;
                for (let j = 0; j < invasors.length; j++) {
                    let inv = invasors[j];
                    if (inv.viu &&
                        bales[i].x > inv.x && bales[i].x < inv.x + inv.amplada &&
                        bales[i].y > inv.y && bales[i].y < inv.y + inv.alcada) {
                        
                        inv.viu = false;
                        punts += 10;
                        actualitzarUI();
                        eliminatBala = true;
                        break;
                    }
                }

                if (eliminatBala || bales[i].y < 0) {
                    bales.splice(i, 1);
                }
            }

            let tocarVora = false;
            let viusComptador = 0;
            for (let inv of invasors) {
                if (!inv.viu) continue;
                viusComptador++;
                inv.x += direccioInvasors * 1.3;

                if (inv.x <= 20 || inv.x >= canvas.width - inv.amplada - 20) {
                    tocarVora = true;
                }

                if (inv.y + inv.alcada >= jugador.y) {
                    jocActiu = false;
                    missatgePantalla = "Els invasors han arribat al final! Game Over";
                }
            }

            if (viusComptador === 0) {
                jocActiu = false;
                missatgePantalla = "🏆 Victòria! Has destruït tots els invasors!";
            }

            if (tocarVora) {
                direccioInvasors *= -1;
                for (let inv of invasors) {
                    inv.y += 20;
                }
            }

            if (Math.random() < 0.03 && invasors.filter(i => i.viu).length > 0) {
                let vius = invasors.filter(i => i.viu);
                let tirador = vius[Math.floor(Math.random() * vius.length)];
                balesEnreres.push({
                    x: tirador.x + tirador.amplada / 2,
                    y: tirador.y + tirador.alcada,
                    radi: 5,
                    vel: 4.5
                });
            }

            for (let i = balesEnreres.length - 1; i >= 0; i--) {
                balesEnreres[i].y += balesEnreres[i].vel;

                let b = balesEnreres[i];
                if (b.x > jugador.x && b.x < jugador.x + jugador.amplada &&
                    b.y > jugador.y && b.y < jugador.y + jugador.alcada) {
                    
                    balesEnreres.splice(i, 1);

                    if (teEscut) {
                        teEscut = false;
                        powerUpActiu = false;
                    } else {
                        vides--;
                        actualitzarUI();
                        if (vides <= 0) {
                            jocActiu = false;
                            missatgePantalla = "Game Over - T'has quedat sense vides";
                        }
                    }
                    continue;
                }

                if (b.y > canvas.height) {
                    balesEnreres.splice(i, 1);
                }
            }

            if (punts > record) {
                record = punts;
                localStorage.setItem('espai_record_full_files', record);
                txtRecord.innerText = record;
            }
        }

        function dibuixar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = powerUpActiu ? '#38bdf8' : '#22c55e';
            ctx.fillRect(jugador.x, jugador.y, jugador.amplada, jugador.alcada);

            if (teEscut) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(jugador.x + jugador.amplada / 2, jugador.y + jugador.alcada / 2, 42, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Dibuixar Invasors amb el seu color corresponent segons la fila
            for (let inv of invasors) {
                if (inv.viu) {
                    ctx.fillStyle = inv.color;
                    ctx.fillRect(inv.x, inv.y, inv.amplada, inv.alcada);
                    
                    // Ulls alienígenes
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(inv.x + 8, inv.y + 7, 6, 6);
                    ctx.fillRect(inv.x + 31, inv.y + 7, 6, 6);
                }
            }

            if (cubEnergia) {
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(cubEnergia.x, cubEnergia.y, cubEnergia.amplada, cubEnergia.alcada);
                ctx.strokeStyle = '#93c5fd';
                ctx.lineWidth = 3;
                ctx.strokeRect(cubEnergia.x, cubEnergia.y, cubEnergia.amplada, cubEnergia.alcada);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(cubEnergia.vides, cubEnergia.x + cubEnergia.amplada / 2, cubEnergia.y + cubEnergia.alcada / 2 + 7);
                ctx.textAlign = 'left';
            }

            ctx.fillStyle = powerUpActiu ? '#38bdf8' : '#facc15';
            for (let b of bales) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radi, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#f87171';
            for (let b of balesEnreres) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radi, 0, Math.PI * 2);
                ctx.fill();
            }

            if (!jocActiu) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 26px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(missatgePantalla, canvas.width / 2, canvas.height / 2 - 25);

                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText("Prem ESPAI per tornar a jugar", canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = 'left';
            }
        }

        function bucle() {
            actualitzar();
            dibuixar();
            requestAnimationFrame(bucle);
        }

        crearInvasors();
        actualitzarUI();
        bucle();
    </script>
</body>
</html>
