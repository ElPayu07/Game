<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasors Espacials</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* HUD Superior */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .hud div {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hud span {
            color: #38bdf8;
        }

        /* Canvas adaptat */
        canvas {
            background-color: #020617;
            max-width: 100vw;
            max-height: calc(100vh - 60px);
            width: auto;
            height: auto;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            margin-top: 30px;
        }

        /* Peu d'instruccions */
        .instruccions-flotants {
            position: absolute;
            bottom: 8px;
            font-size: 0.8em;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px 18px;
            border-radius: 20px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="hud">
        <div>Punts: <span id="txt-punts">0</span></div>
        <div>Nivell: <span id="txt-nivell">1</span></div>
        <div>Vides: <span id="txt-vides">❤️ ❤️ ❤️</span></div>
        <div>Rècord: <span id="txt-record">0</span></div>
    </div>

    <canvas id="canvas" width="900" height="650"></canvas>

    <div class="instruccions-flotants">
        <b>Fletxes / A-D</b>: Moure | <b>Espai</b>: Disparar | Destrueix el cub blau (3 vides) per a Escut i Potència 7s
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const txtPunts = document.getElementById('txt-punts');
        const txtNivell = document.getElementById('txt-nivell');
        const txtVides = document.getElementById('txt-vides');
        const txtRecord = document.getElementById('txt-record');

        // Estat Global del Joc
        let punts = 0;
        let nivell = 1;
        let vides = 3;
        let record = localStorage.getItem('espai_record_avancat') || 0;
        txtRecord.innerText = record;

        let jocActiu = true;
        let transicioNivell = false;
        let missatgePantalla = "Prem ESPAI per Començar";

        // Tecles premudes
        const tecles = {};
        window.addEventListener('keydown', e => {
            if (e.code === 'Space') {
                if (!jocActiu) reiniciarJoc();
                else if (!transicioNivell) disparar();
                e.preventDefault();
            }
            tecles[e.code] = true;
        });
        window.addEventListener('keyup', e => tecles[e.code] = false);

        // 1. Fons d'Estrelles Parallax (3 Capes)
        const estrelles = [];
        for (let i = 0; i < 120; i++) {
            estrelles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                mida: Math.random() * 2 + 0.5,
                vel: Math.random() * 1.5 + 0.2, // Velocitats diferents per profunditat
                opacitat: Math.random() * 0.7 + 0.3
            });
        }

        // 2. Partícules d'Explosió
        let particules = [];

        function crearExplosio(x, y, color) {
            for (let i = 0; i < 18; i++) {
                const angle = Math.random() * Math.PI * 2;
                const velocitat = Math.random() * 4.5 + 1;
                particules.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * velocitat,
                    vy: Math.sin(angle) * velocitat,
                    mida: Math.random() * 3 + 2,
                    color: color,
                    vida: 1.0 // Opacitat/temps de vida
                });
            }
        }

        // Jugador
        const jugador = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 55,
            amplada: 50,
            alcada: 30,
            velocitat: 6.5
        };

        let bales = [];
        let balesEnreres = [];
        let invasors = [];
        let totalInvasorsOnada = 0;
        let direccioInvasors = 1;

        // Cub d'energia
        let cubEnergia = null;
        let temporitzadorCub = 0;
        let tempsProximCub = recapturarTempsCub();

        // Power-up / Escut
        let powerUpActiu = false;
        let teEscut = false;
        let tempsPowerUpFi = 0;

        function recapturarTempsCub() {
            return Math.floor(Math.random() * 300) + 1500; // 25-30 segons
        }

        function reiniciarJoc() {
            punts = 0;
            nivell = 1;
            vides = 3;
            jocActiu = true;
            transicioNivell = false;
            bales = [];
            balesEnreres = [];
            particules = [];
            powerUpActiu = false;
            teEscut = false;
            temporitzadorCub = 0;
            tempsProximCub = recapturarTempsCub();
            crearInvasors();
            actualitzarUI();
        }

        function crearInvasors() {
            invasors = [];
            const files = 5;
            const columnes = 9;
            const espaiX = 80;
            const iniciX = (canvas.width - (columnes * espaiX)) / 2;

            for (let f = 0; f < files; f++) {
                let colorInv = '#ef4444'; // Fila 0: Vermella (més llunyana)
                let tipus = 'saucer';

                if (f === 1 || f === 2) {
                    colorInv = '#f97316'; // Files 1,2: Taronges
                    tipus = 'insect';
                } else if (f === 3 || f === 4) {
                    colorInv = '#22c55e'; // Files 3,4: Verdes (més properes)
                    tipus = 'squid';
                }

                for (let c = 0; c < columnes; c++) {
                    invasors.push({
                        x: iniciX + c * espaiX,
                        y: 65 + f * 45,
                        amplada: 42,
                        alcada: 28,
                        fila: f,
                        tipus: tipus,
                        color: colorInv,
                        viu: true
                    });
                }
            }
            totalInvasorsOnada = invasors.length;
        }

        function seguentNivell() {
            transicioNivell = true;
            bales = [];
            balesEnreres = [];
            nivell++;
            actualitzarUI();

            setTimeout(() => {
                crearInvasors();
                transicioNivell = false;
            }, 1200);
        }

        function disparar() {
            if (!jocActiu || transicioNivell) return;
            let midaBala = powerUpActiu ? 10 : 5;
            let velBala = powerUpActiu ? 12 : 8;
            
            bales.push({
                x: jugador.x + jugador.amplada / 2 - midaBala / 2,
                y: jugador.y - 5,
                radi: midaBala,
                vel: velBala
            });
        }

        function actualitzarUI() {
            txtPunts.innerText = punts;
            txtNivell.innerText = nivell;
            let cors = "";
            for (let i = 0; i < vides; i++) cors += "❤️ ";
            txtVides.innerText = cors.trim();
        }

        // Lògica del joc
        function actualitzar() {
            // Actualitzar estrelles (fons) sempre
            for (let e of estrelles) {
                e.y += e.vel;
                if (e.y > canvas.height) {
                    e.y = 0;
                    e.x = Math.random() * canvas.width;
                }
            }

            // Actualitzar partícules d'explosió
            for (let i = particules.length - 1; i >= 0; i--) {
                let p = particules[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vida -= 0.025;
                if (p.vida <= 0) particules.splice(i, 1);
            }

            if (!jocActiu || transicioNivell) return;

            // Moviment Jugador
            if ((tecles['ArrowLeft'] || tecles['KeyA']) && jugador.x > 15) {
                jugador.x -= jugador.velocitat;
            }
            if ((tecles['ArrowRight'] || tecles['KeyD']) && jugador.x < canvas.width - jugador.amplada - 15) {
                jugador.x += jugador.velocitat;
            }

            // Temporitzador Power-up (7s)
            if (powerUpActiu && Date.now() > tempsPowerUpFi) {
                powerUpActiu = false;
                teEscut = false;
            }

            // Cub d'Energia Blau
            if (!cubEnergia) {
                temporitzadorCub++;
                if (temporitzadorCub >= tempsProximCub) {
                    cubEnergia = {
                        x: Math.random() * (canvas.width - 60),
                        y: 50,
                        amplada: 42,
                        alcada: 42,
                        vides: 3,
                        velY: 1.2
                    };
                    temporitzadorCub = 0;
                    tempsProximCub = recapturarTempsCub();
                }
            } else {
                cubEnergia.y += cubEnergia.velY;
                if (cubEnergia.y > 180 || cubEnergia.y < 40) cubEnergia.velY *= -1;
            }

            // Bales Jugador
            for (let i = bales.length - 1; i >= 0; i--) {
                bales[i].y -= bales[i].vel;

                // Impacte en Cub d'Energia
                if (cubEnergia && 
                    bales[i].x > cubEnergia.x && bales[i].x < cubEnergia.x + cubEnergia.amplada &&
                    bales[i].y > cubEnergia.y && bales[i].y < cubEnergia.y + cubEnergia.alcada) {
                    
                    cubEnergia.vides--;
                    crearExplosio(bales[i].x, bales[i].y, '#3b82f6');
                    bales.splice(i, 1);

                    if (cubEnergia.vides <= 0) {
                        powerUpActiu = true;
                        teEscut = true;
                        tempsPowerUpFi = Date.now() + 7000;
                        cubEnergia = null;
                    }
                    continue;
                }

                // Impacte en Invasors
                let destruita = false;
                for (let j = 0; j < invasors.length; j++) {
                    let inv = invasors[j];
                    if (inv.viu &&
                        bales[i].x > inv.x && bales[i].x < inv.x + inv.amplada &&
                        bales[i].y > inv.y && bales[i].y < inv.y + inv.alcada) {
                        
                        inv.viu = false;
                        punts += 10;
                        actualitzarUI();
                        crearExplosio(inv.x + inv.amplada/2, inv.y + inv.alcada/2, inv.color);
                        destruita = true;
                        break;
                    }
                }

                if (destruita || bales[i].y < 0) {
                    bales.splice(i, 1);
                }
            }

            // Dificultat Dinàmica: Més ràpid com menys invasors queden + augment per Nivell
            let viusComptador = invasors.filter(i => i.viu).length;
            
            if (viusComptador === 0 && !transicioNivell) {
                seguentNivell();
                return;
            }

            let fraccioEliminats = 1 - (viusComptador / totalInvasorsOnada);
            // Acceleració progressiva estil Space Invaders clàssic
            let multVelocitatDificultat = 1 + (fraccioEliminats * 2.2); 
            let velActualInvasors = (1.2 + (nivell - 1) * 0.25) * multVelocitatDificultat;

            let tocarVora = false;
            for (let inv of invasors) {
                if (!inv.viu) continue;
                inv.x += direccioInvasors * velActualInvasors;

                if (inv.x <= 15 || inv.x >= canvas.width - inv.amplada - 15) {
                    tocarVora = true;
                }

                if (inv.y + inv.alcada >= jugador.y) {
                    jocActiu = false;
                    missatgePantalla = "Els invasors han conquerit la Terra! Game Over";
                }
            }

            if (tocarVora) {
                direccioInvasors *= -1;
                for (let inv of invasors) {
                    inv.y += 18;
                }
            }

            // Trets dels Invasors
            let freqDispar = 0.02 + (nivell * 0.005);
            if (Math.random() < freqDispar && viusComptador > 0) {
                let vius = invasors.filter(i => i.viu);
                let tirador = vius[Math.floor(Math.random() * vius.length)];
                balesEnreres.push({
                    x: tirador.x + tirador.amplada / 2,
                    y: tirador.y + tirador.alcada,
                    radi: 5,
                    vel: 4.5 + (nivell * 0.2)
                });
            }

            // Actualitzar Bales Enemigues
            for (let i = balesEnreres.length - 1; i >= 0; i--) {
                balesEnreres[i].y += balesEnreres[i].vel;
                let b = balesEnreres[i];

                if (b.x > jugador.x && b.x < jugador.x + jugador.amplada &&
                    b.y > jugador.y && b.y < jugador.y + jugador.alcada) {
                    
                    crearExplosio(b.x, b.y, teEscut ? '#38bdf8' : '#ef4444');
                    balesEnreres.splice(i, 1);

                    if (teEscut) {
                        teEscut = false;
                        powerUpActiu = false;
                    } else {
                        vides--;
                        actualitzarUI();
                        if (vides <= 0) {
                            jocActiu = false;
                            missatgePantalla = "Game Over - Nau Destruïda";
                        }
                    }
                    continue;
                }

                if (b.y > canvas.height) {
                    balesEnreres.splice(i, 1);
                }
            }

            // Rècord
            if (punts > record) {
                record = punts;
                localStorage.setItem('espai_record_avancat', record);
                txtRecord.innerText = record;
            }
        }

        // --- Renderitzat Gràfic Avançat ---

        function dibuixarJugador() {
            ctx.save();
            ctx.translate(jugador.x + jugador.amplada / 2, jugador.y + jugador.alcada / 2);

            let colorPrincipal = powerUpActiu ? '#38bdf8' : '#22c55e';

            // Propulsor del darrere (foc)
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(-6, 12);
            ctx.lineTo(0, 20 + Math.random() * 6);
            ctx.lineTo(6, 12);
            ctx.fill();

            // Cos del Caça Espacial
            ctx.fillStyle = colorPrincipal;
            ctx.beginPath();
            ctx.moveTo(0, -18); // Punta
            ctx.lineTo(22, 12); // Ala dreta
            ctx.lineTo(12, 8);
            ctx.lineTo(0, 12); // Cua interior
            ctx.lineTo(-12, 8);
            ctx.lineTo(-22, 12); // Ala esquerra
            ctx.closePath();
            ctx.fill();

            // Cabina de control
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.arc(0, -2, 5, 0, Math.PI * 2);
            ctx.fill();

            // Escut
            if (teEscut) {
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.arc(0, 0, 36, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        function dibuixarInvasor(inv) {
            ctx.save();
            ctx.fillStyle = inv.color;
            ctx.shadowColor = inv.color;
            ctx.shadowBlur = 6;

            const x = inv.x;
            const y = inv.y;
            const w = inv.amplada;
            const h = inv.alcada;

            ctx.beginPath();
            if (inv.tipus === 'saucer') {
                // Nau Tipus Cúpula (Fila Superior)
                ctx.ellipse(x + w/2, y + h/2 + 2, w/2, h/3, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(x + w/2, y + h/3, 7, 0, Math.PI, true);
                ctx.fill();
            } else if (inv.tipus === 'insect') {
                // Nau Insecte / Antenes (Files Mitjanes)
                ctx.roundRect(x + 4, y + 4, w - 8, h - 8, 6);
                ctx.fill();
                // Detalls ulls
                ctx.fillStyle = '#000';
                ctx.fillRect(x + 10, y + 10, 6, 6);
                ctx.fillRect(x + w - 16, y + 10, 6, 6);
            } else {
                // Alien Pop / Classic (Files Inferiors)
                ctx.beginPath();
                ctx.arc(x + w/2, y + 10, 14, Math.PI, 0);
                ctx.lineTo(x + w - 6, y + h);
                ctx.lineTo(x + w/2, y + h - 6);
                ctx.lineTo(x + 6, y + h);
                ctx.closePath();
                ctx.fill();
                // Ulls brillants
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 12, y + 10, 5, 5);
                ctx.fillRect(x + w - 17, y + 10, 5, 5);
            }

            ctx.restore();
        }

        function dibuixar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibuixar Estrelles (Fons Parallax)
            for (let e of estrelles) {
                ctx.fillStyle = `rgba(255, 255, 255, ${e.opacitat})`;
                ctx.fillRect(e.x, e.y, e.mida, e.mida);
            }

            // 2. Partícules d'Explosió
            for (let p of particules) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.vida);
                ctx.fillRect(p.x, p.y, p.mida, p.mida);
            }
            ctx.globalAlpha = 1.0;

            // 3. Jugador
            dibuixarJugador();

            // 4. Invasors
            for (let inv of invasors) {
                if (inv.viu) dibuixarInvasor(inv);
            }

            // 5. Cub d'Energia
            if (cubEnergia) {
                ctx.fillStyle = '#3b82f6';
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 10;
                ctx.fillRect(cubEnergia.x, cubEnergia.y, cubEnergia.amplada, cubEnergia.alcada);
                ctx.strokeStyle = '#93c5fd';
                ctx.lineWidth = 2;
                ctx.strokeRect(cubEnergia.x, cubEnergia.y, cubEnergia.amplada, cubEnergia.alcada);
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(cubEnergia.vides, cubEnergia.x + cubEnergia.amplada / 2, cubEnergia.y + cubEnergia.alcada / 2 + 6);
                ctx.textAlign = 'left';
            }

            // 6. Bales del Jugador
            ctx.fillStyle = powerUpActiu ? '#38bdf8' : '#facc15';
            for (let b of bales) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radi, 0, Math.PI * 2);
                ctx.fill();
            }

            // 7. Bales Enemigues
            ctx.fillStyle = '#f87171';
            for (let b of balesEnreres) {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radi, 0, Math.PI * 2);
                ctx.fill();
            }

            // Missatge Transició de Nivell
            if (transicioNivell) {
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 36px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`NIVELL ${nivell}`, canvas.width / 2, canvas.height / 2);
                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#cbd5e1';
                ctx.fillText("S'aproxima una nova onada d'invasors...", canvas.width / 2, canvas.height / 2 + 40);
                ctx.textAlign = 'left';
            }

            // Pantalla de Game Over
            if (!jocActiu) {
                ctx.fillStyle = 'rgba(2, 6, 23, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(missatgePantalla, canvas.width / 2, canvas.height / 2 - 20);

                ctx.font = '18px sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText("Prem ESPAI per tornar a jugar", canvas.width / 2, canvas.height / 2 + 35);
                ctx.textAlign = 'left';
            }
        }

        function bucle() {
            actualitzar();
            dibuixar();
            requestAnimationFrame(bucle);
        }

        // Inicialització
        crearInvasors();
        actualitzarUI();
        bucle();
    </script>
</body>
</html>
