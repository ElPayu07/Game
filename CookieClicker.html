        const comptadorElement = document.getElementById('comptador');
        const galetaElement = document.getElementById('galeta');
        const produccioPerSegonElement = document.getElementById('produccio-per-segon');
        const galetesPerClicElement = document.getElementById('galetes-per-clic');
        const clicsTotalsElement = document.getElementById('clics-totals');

        const milloresContainer = document.getElementById('millores-container');
        const assolimentsContainer = document.getElementById('assoliments-container');
        const estatGuardatElement = document.getElementById('estat-guardat');
        const comptadorAssoliments = document.getElementById('comptador-assoliments');

        function formatNumero(num) {
            if (isNaN(num) || num === 0) return "0";
            let valorAbsolut = Math.abs(num);
            const unitats = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];
            let unitatIndex = 0;
            
            while (valorAbsolut >= 1000 && unitatIndex < unitats.length - 1) {
                valorAbsolut /= 1000;
                unitatIndex++;
            }
            
            let decimals = valorAbsolut < 10 ? 2 : (valorAbsolut < 100 ? 1 : 0);
            let numeroFormat = valorAbsolut.toFixed(decimals);
            
            if (numeroFormat.endsWith('.00')) numeroFormat = numeroFormat.slice(0, -3);
            else if (numeroFormat.endsWith('.0')) numeroFormat = numeroFormat.slice(0, -2);
            
            return (num < 0 ? "-" : "") + numeroFormat + unitats[unitatIndex];
        }

        function calcularCost(millora) {
            return Math.floor(millora.costBase * Math.pow(factorCost, millora.nivell));
        }

        function calcularEficiencia(millora) {
            const cost = calcularCost(millora);
            const valorTotal = millora.valor * (millora.nivell + 1);
            if (millora.tipus === 'especial') return (valorTotal * 10) / cost;
            return valorTotal / cost;
        }

        function getBonusAssoliments() {
            const completats = assoliments.filter(a => a.desbloquejat).length;
            return 1 + (completats * 0.02);
        }

        function canviarPestanya(pestanya) {
            pestanyaActual = pestanya;
            document.getElementById('pestanya-botiga-btn').classList.toggle('active', pestanya === 'botiga');
            document.getElementById('pestanya-assoliments-btn').classList.toggle('active', pestanya === 'assoliments');
            document.getElementById('seccio-botiga').style.display = pestanya === 'botiga' ? 'block' : 'none';
            document.getElementById('seccio-assoliments').style.display = pestanya === 'assoliments' ? 'block' : 'none';
            if (pestanya === 'assoliments') renderitzatAssoliments();
        }

        function comprovarAssoliments() {
            assoliments.forEach(a => {
                if (!a.desbloquejat) {
                    let valorActual = a.tipus === 'galetes' ? galetesTotalsAcumulades : clicsTotals;
                    if (valorActual >= a.objectiu) {
                        a.desbloquejat = true;
                        mostrarNotificacioAssoliment(a);
                        if (pestanyaActual === 'assoliments') renderitzatAssoliments();
                    }
                }
            });
            actualitzarComptadorAssoliments();
        }

        function mostrarNotificacioAssoliment(assoliment) {
            const notif = document.getElementById('notificacio-assoliment');
            document.getElementById('notif-titol').textContent = "Assoliment: " + assoliment.nom;
            document.getElementById('notif-desc').textContent = assoliment.descripcio + " (+2% Bonus)";
            notif.classList.add('show');
            setTimeout(() => { notif.classList.remove('show'); }, 4000);
        }

        function actualitzarComptadorAssoliments() {
            const completats = assoliments.filter(a => a.desbloquejat).length;
            comptadorAssoliments.textContent = `${completats}/${assoliments.length}`;
            bonusAssolimentsElement.textContent = `+${(completats * 2)}%`;
        }

        function renderitzatAssoliments() {
            assolimentsContainer.innerHTML = '';
            assoliments.forEach(a => {
                const div = document.createElement('div');
                div.className = `assoliment ${a.desbloquejat ? 'desbloquejat' : ''}`;
                let valorActual = a.tipus === 'galetes' ? galetesTotalsAcumulades : clicsTotals;
                let percentatge = Math.min(100, Math.floor((valorActual / a.objectiu) * 100));
                
                div.innerHTML = `
                    <div class="assoliment-icona">${a.icona}</div>
                    <div style="flex:1;">
                        <div class="assoliment-titol">${a.nom}</div>
                        <div class="assoliment-descripcio">${a.descripcio}</div>
                        <div class="barra-progres-outer">
                            <div class="barra-progres-inner" style="width: ${a.desbloquejat ? 100 : percentatge}%"></div>
                        </div>
                    </div>
                `;
                assolimentsContainer.appendChild(div);
            });
        }

        function ordenarMillores() {
            if (ordreActual === 'preu') {
                return [...millores].sort((a, b) => calcularCost(a) - calcularCost(b));
            } else if (ordreActual === 'eficiència') {
                return [...millores].sort((a, b) => calcularEficiencia(b) - calcularEficiencia(a));
            }
            return [...millores];
        }

        function filtrarMillores(milloresOrdenades) {
            if (filtreActual === 'totes') return milloresOrdenades;
            return milloresOrdenades.filter(m => m.tipus === filtreActual);
        }

        function inicialitzarMillores() {
            milloresContainer.innerHTML = '';
            const milloresOrdenades = ordenarMillores();
            const milloresFiltrades = filtrarMillores(milloresOrdenades);
            
            milloresFiltrades.forEach(millora => {
                const costActual = calcularCost(millora);
                const esEspecialIComprada = millora.tipus === "especial" && millora.nivell >= 1;
                
                const milloraElement = document.createElement('div');
                milloraElement.className = 'millora';
                
                let textBoto = `Millorar (${formatNumero(millora.valor)} ${millora.tipus === 'clic' ? '/clic' : millora.tipus === 'auto' ? '/s' : 'mult'})`;
                let textCost = `Cost: ${formatNumero(costActual)} galetes`;
                let textNivell = `Nivell: ${millora.nivell}`;
                
                if (esEspecialIComprada) {
                    textBoto = "Comprat";
                    textCost = "Estat: Ja comprat";
                    textNivell = "1/1";
                }

                milloraElement.innerHTML = `
                    <div class="millora-header">
                        <div class="millora-info">
                            <h3>${millora.nom} <span style="font-size:0.75rem; color:#8b4513;">(${millora.tipus})</span></h3>
                            <p>${millora.descripcio}</p>
                        </div>
                        <div class="millora-nivell">${textNivell}</div>
                    </div>
                    <div class="millora-cost">${textCost}</div>
                    <button class="millora-boto" onclick="comprarMillora(${millora.id})" id="boto-millora-${millora.id}" ${esEspecialIComprada ? 'disabled' : ''}>
                        ${textBoto}
                    </button>
                `;
                
                milloresContainer.appendChild(milloraElement);
            });
            actualitzarFiltres();
        }

        function actualitzarFiltres() {
            const botonsFiltre = document.querySelectorAll('.filtre-btn');
            botonsFiltre.forEach(boto => {
                if (boto.textContent.includes('Preu') && ordreActual === 'preu') boto.classList.add('active');
                else if (boto.textContent.includes('Eficiència') && ordreActual === 'eficiència') boto.classList.add('active');
                else if (boto.textContent === 'Totes' && filtreActual === 'totes') boto.classList.add('active');
                else if (boto.textContent === 'Clic' && filtreActual === 'clic') boto.classList.add('active');
                else if (boto.textContent === 'Automàtiques' && filtreActual === 'auto') boto.classList.add('active');
                else if (boto.textContent === 'Especials' && filtreActual === 'especial') boto.classList.add('active');
                else boto.classList.remove('active');
            });
        }

        function filtreMillores(tipus) {
            filtreActual = tipus;
            inicialitzarMillores();
        }

        function ordenarPer(ordre) {
            ordreActual = ordre;
            inicialitzarMillores();
        }

        function actualitzarPantalla() {
            const bonusMult = getBonusAssoliments();
            comptadorElement.textContent = formatNumero(Math.floor(galetes));
            produccioPerSegonElement.textContent = formatNumero(produccioPerSegon * bonusMult) + "/s";
            galetesPerClicElement.textContent = formatNumero(galetesPerClic * bonusMult);
            clicsTotalsElement.textContent = formatNumero(clicsTotals);
            
            comprovarAssoliments();

            millores.forEach(millora => {
                const costActual = calcularCost(millora);
                const boto = document.getElementById(`boto-millora-${millora.id}`);
                const esEspecialIComprada = millora.tipus === "especial" && millora.nivell >= 1;
                
                if (boto) {
                    if (esEspecialIComprada) {
                        boto.disabled = true;
                        boto.textContent = "Comprat";
                    } else {
                        boto.disabled = galetes < costActual;
                    }
                }
            });
        }

        function clicarGaleta() {
            const guany = galetesPerClic * getBonusAssoliments();
            galetes += guany;
            galetesTotalsAcumulades += guany;
            clicsTotals++;
            
            actualitzarPantalla();
            
            galetaElement.style.transform = 'scale(0.95)';
            setTimeout(() => { galetaElement.style.transform = 'scale(1)'; }, 80);
            
            crearNumeroFlotant(guany);
        }

        function crearNumeroFlotant(valor) {
            const flotant = document.createElement('div');
            flotant.textContent = '+' + formatNumero(valor);
            flotant.style.position = 'absolute';
            flotant.style.color = '#8b4513';
            flotant.style.fontWeight = 'bold';
            flotant.style.fontSize = '1.3rem';
            flotant.style.pointerEvents = 'none';
            flotant.style.left = Math.random() * 140 + 20 + 'px';
            flotant.style.top = Math.random() * 140 + 20 + 'px';
            flotant.style.opacity = '1';
            flotant.style.transition = 'all 0.8s';
            
            galetaElement.appendChild(flotant);
            
            setTimeout(() => {
                flotant.style.opacity = '0';
                flotant.style.transform = 'translateY(-25px)';
            }, 10);
            
            setTimeout(() => {
                if (flotant.parentNode) flotant.parentNode.removeChild(flotant);
            }, 800);
        }

        function comprarMillora(id) {
            const millora = millores.find(m => m.id === id);
            if (!millora) return;
            if (millora.tipus === "especial" && millora.nivell >= 1) return;
            
            const costActual = calcularCost(millora);
            if (galetes < costActual) return;
            
            galetes -= costActual;
            millora.nivell++;
            
            if (millora.tipus === "clic") {
                galetesPerClic += millora.valor;
            } else if (millora.tipus === "auto") {
                produccioPerSegon += millora.valor;
            } else if (millora.tipus === "especial") {
                galetesPerClic *= millora.valor;
                produccioPerSegon *= millora.valor;
            }
            
            guardarProgres();
            actualitzarPantalla();
            inicialitzarMillores();
        }

        function guardarProgres() {
            const dades = {
                galetes: galetes,
                galetesTotalsAcumulades: galetesTotalsAcumulades,
                galetesPerClic: galetesPerClic,
                produccioPerSegon: produccioPerSegon,
                clicsTotals: clicsTotals,
                milloresNivells: millores.map(m => ({ id: m.id, nivell: m.nivell })),
                assolimentsEstat: assoliments.map(a => ({ id: a.id, desbloquejat: a.desbloquejat }))
            };
            localStorage.setItem('clickerGaletesProgres', JSON.stringify(dades));
            
            estatGuardatElement.style.opacity = '1';
            setTimeout(() => { estatGuardatElement.style.opacity = '0'; }, 1500);
        }

        function carregarProgres() {
            const dadesGuardades = localStorage.getItem('clickerGaletesProgres');
            if (dadesGuardades) {
                try {
                    const dades = JSON.parse(dadesGuardades);
                    galetes = dades.galetes || 0;
                    galetesTotalsAcumulades = dades.galetesTotalsAcumulades || galetes;
                    galetesPerClic = dades.galetesPerClic || 1;
                    produccioPerSegon = dades.produccioPerSegon || 0;
                    clicsTotals = dades.clicsTotals || 0;
                    
                    if (dades.milloresNivells) {
                        dades.milloresNivells.forEach(item => {
                            const millora = millores.find(m => m.id === item.id);
                            if (millora) millora.nivell = item.nivell;
                        });
                    }

                    if (dades.assolimentsEstat) {
                        dades.assolimentsEstat.forEach(item => {
                            const assoliment = assoliments.find(a => a.id === item.id);
                            if (assoliment) assoliment.desbloquejat = item.desbloquejat;
                        });
                    }
                    
                    actualitzarPantalla();
                    inicialitzarMillores();
                } catch (e) {
                    console.error("Error en carregar les dades", e);
                }
            }
        }

        function resetJoc() {
            if (confirm("Estàs segur que vols reiniciar el joc? S'esborrarà tot el teu progrés.")) {
                galetes = 0;
                galetesTotalsAcumulades = 0;
                galetesPerClic = 1;
                produccioPerSegon = 0;
                clicsTotals = 0;
                millores.forEach(m => m.nivell = 0);
                assoliments.forEach(a => a.desbloquejat = false);
                
                localStorage.removeItem('clickerGaletesProgres');
                actualitzarPantalla();
                inicialitzarMillores();
                renderitzatAssoliments();
            }
        }

        function exportarDades() {
            guardarProgres();
            const dadesGuardades = localStorage.getItem('clickerGaletesProgres');
            if (dadesGuardades) {
                const codiExportat = btoa(dadesGuardades);
                prompt("Copia aquest codi per guardar la teva partida:", codiExportat);
            }
        }

        function importarDades() {
            const codiImportat = prompt("Enganxa el teu codi de partida guardada:");
            if (codiImportat) {
                try {
                    const dadesDescodificades = atob(codiImportat);
                    JSON.parse(dadesDescodificades);
                    localStorage.setItem('clickerGaletesProgres', dadesDescodificades);
                    carregarProgres();
                    alert("Partida carregada amb èxit!");
                } catch (e) {
                    alert("El codi d'importació no és vàlid.");
                }
            }
        }

        setInterval(() => {
            if (produccioPerSegon > 0) {
                const guanyAuto = (produccioPerSegon * getBonusAssoliments()) / 10;
                galetes += guanyAuto;
                galetesTotalsAcumulades += guanyAuto;
                actualitzarPantalla();
            }
        }, 100);

        setInterval(() => { guardarProgres(); }, 30000);

        window.onload = function() {
            carregarProgres();
            inicialitzarMillores();
            actualitzarPantalla();
        };
    </script>
